    // ========================================================================
    // 3. STORAGE & MATH HELPERS
    // ========================================================================
    const STORAGE_KEYS = {
      USERS: 'ironpulse_users_v1',
      SESSION: 'ironpulse_session_v1',
      USER_DATA_PREFIX: 'ironpulse_userdata_v1_',
      GUEST_DATA: 'ironpulse_guest_userdata_v2',
      COACH_HISTORY: 'ironpulse_coach_history_v2',
    };

    const memoryFallback = {};
    const safeReadJSON = (key, fallback) => {
      try {
        const raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return key in memoryFallback ? memoryFallback[key] : fallback;
      }
    };
    const safeWriteJSON = (key, val) => {
      memoryFallback[key] = val;
      try { window.localStorage.setItem(key, JSON.stringify(val)); } catch {}
    };
    const safeRemoveKey = (key) => {
      delete memoryFallback[key];
      try { window.localStorage.removeItem(key); } catch {}
    };

    const hashPassword = (pw) => {
      let hash = 0;
      for (let i = 0; i < pw.length; i++) {
        hash = (hash << 5) - hash + pw.charCodeAt(i);
        hash |= 0;
      }
      return `hp_${Math.abs(hash).toString(36)}_${pw.length}`;
    };

    const uid = () => `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    const todayISO = () => {
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    };
    const daysAgoISO = (days) => {
      const d = new Date();
      d.setDate(d.getDate() - days);
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    };
    const formatDateLabel = (iso) => {
      if (!iso) return '';
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    };
    const formatShortDate = (iso) => {
      if (!iso) return '';
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    };
    const formatElapsed = (ms) => {
      const totalSecs = Math.max(0, Math.floor(ms / 1000));
      const hrs = Math.floor(totalSecs / 3600);
      const mins = Math.floor((totalSecs % 3600) / 60);
      const secs = totalSecs % 60;
      if (hrs > 0) return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    };
    const getWorkoutElapsedMs = (workout, nowMs = Date.now()) => {
      if (!workout) return 0;
      if (workout.editingHistoryId) return workout.durationSeconds ? workout.durationSeconds * 1000 : 0;
      if (!workout.startedAt) return 0;
      const startMs = new Date(workout.startedAt).getTime();
      const priorPaused = workout.pausedTotalMs || 0;
      const activePause = workout.isPaused && workout.pausedAt ? Math.max(0, nowMs - new Date(workout.pausedAt).getTime()) : 0;
      return Math.max(0, nowMs - startMs - priorPaused - activePause);
    };
    const formatTimeOfDay = (iso) => {
      if (!iso) return '';
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    };
    const formatTimerClock = (totalSeconds) => {
      const clamped = Math.max(0, Math.floor(totalSeconds));
      return `${String(Math.floor(clamped / 60)).padStart(2, '0')}:${String(clamped % 60).padStart(2, '0')}`;
    };

    // 1RM Formulas
    const calcEpley1RM = (weight, reps) => {
      const w = Number(weight) || 0;
      const r = Number(reps) || 0;
      if (w <= 0 || r <= 0) return 0;
      if (r === 1) return Math.round(w * 10) / 10;
      return Math.round(w * (1 + r / 30) * 10) / 10;
    };
    const calcBrzycki1RM = (weight, reps) => {
      const w = Number(weight) || 0;
      const r = Number(reps) || 0;
      if (w <= 0 || r <= 0) return 0;
      if (r === 1) return Math.round(w * 10) / 10;
      if (r >= 37) return calcEpley1RM(w, r);
      return Math.round(w * (36 / (37 - r)) * 10) / 10;
    };
    const calc1RM = calcEpley1RM;

    const buildWorkingSetTable = (oneRM, unit) => {
      const step = unit === 'lbs' ? 5 : 2.5;
      const zones = [
        { pct: 95, repRange: '1–2 reps' },
        { pct: 90, repRange: '3–4 reps' },
        { pct: 85, repRange: '4–6 reps' },
        { pct: 80, repRange: '6–8 reps' },
        { pct: 75, repRange: '8–10 reps' },
        { pct: 70, repRange: '10–12 reps' },
        { pct: 65, repRange: '12–15 reps' },
      ];
      return zones.map(({ pct, repRange }) => {
        const exact = Math.round(oneRM * (pct / 100) * 10) / 10;
        const rounded = Math.round(Math.round(exact / step) * step * 10) / 10;
        return { pct, exact, rounded, repRange };
      });
    };

    // Plate Math for Barbell & Dumbbells
    const METRIC_PLATES = [

        let sessionTopWeight = 0, sessionVolume = 0, sessionBestSet = null, sessionBest1RM = 0;
        matchEx.forEach((ex) => {
          (ex.sets || []).forEach((s) => {
            if (!s.completed || s.isWarmup) return;
            const wt = Number(s.weight) || 0;
            const rp = Number(s.reps) || 0;
            if (rp <= 0 && wt <= 0) return;
            totalSets += 1;
            const vol = wt * rp;
            sessionVolume += vol;
            totalLifetimeVolume += vol;
            if (wt > sessionTopWeight) sessionTopWeight = wt;
            if (wt > bestWeight) bestWeight = wt;
            if (rp > bestReps) bestReps = rp;
            const est1RM = calc1RM(wt, rp);
            if (est1RM > sessionBest1RM) sessionBest1RM = est1RM;
            if (est1RM > best1RM) best1RM = est1RM;
            if (!bestSet || wt > bestSet.weight || (wt === bestSet.weight && rp > bestSet.reps)) bestSet = { weight: wt, reps: rp, date: w.date };
            if (!sessionBestSet || wt > sessionBestSet.weight || (wt === sessionBestSet.weight && rp > sessionBestSet.reps)) sessionBestSet = { weight: wt, reps: rp };
          });
        });
        if (sessionVolume > 0 || sessionTopWeight > 0) {
          points.push({ date: w.date, workoutName: w.name, topWeight: sessionTopWeight, volume: Math.round(sessionVolume), bestSet: sessionBestSet, est1RM: sessionBest1RM });
        }
      });
      return { points, bestWeight, bestReps, bestSet, best1RM, totalLifetimeVolume: Math.round(totalLifetimeVolume), totalSessions: points.length, totalSets };
    };

    const isSetPersonalRecord = (exerciseId, set, priorWorkouts) => {
      if (!set.completed || set.isWarmup) return { isPR: false, reason: null, est1RM: 0 };
      const wt = Number(set.weight) || 0;
      const rp = Number(set.reps) || 0;
      if (wt <= 0 || rp <= 0) return { isPR: false, reason: null, est1RM: 0 };
      const history = getExerciseAnalytics(exerciseId, priorWorkouts);
      if (history.totalSets === 0) return { isPR: false, reason: null, est1RM: calc1RM(wt, rp) };
      const est1RM = calc1RM(wt, rp);
      if (est1RM > history.best1RM) return { isPR: true, reason: '1RM', est1RM };
      if (wt > history.bestWeight) return { isPR: true, reason: 'WEIGHT', est1RM };
      return { isPR: false, reason: null, est1RM };
    };

    const getNextTargetSuggestion = (exerciseId, workouts, unit = 'kg') => {
      const analytics = getExerciseAnalytics(exerciseId, workouts);
      if (!analytics.points.length || !analytics.bestSet) return null;
      const { weight, reps } = analytics.bestSet;
      const increment = unit === 'lbs' ? 5 : 2.5;
      if (weight === 0) return { headline: `Beat your best of ${reps} reps`, detail: `Aim for ${reps + 1} reps on your top set today.` };
      if (reps >= 10) return { headline: `Beat your last best of ${weight}${unit} × ${reps}`, detail: `Try ${weight + increment}${unit} × ${Math.max(6, reps - 2)} or push to ${weight}${unit} × ${reps + 1}.` };
      return { headline: `Beat your last best of ${weight}${unit} × ${reps}`, detail: `Aim for ${weight}${unit} × ${reps + 1} or step up to ${weight + increment}${unit} × ${reps}.` };
    };

    const computeStreakAndWeekly = (workouts) => {
      const now = new Date();
      const startOfThisWeek = new Date(now);
      const day = startOfThisWeek.getDay();
      startOfThisWeek.setDate(startOfThisWeek.getDate() - (day === 0 ? 6 : day - 1));
      startOfThisWeek.setHours(0, 0, 0, 0);
      const weeklyBuckets = [];
      for (let i = 5; i >= 0; i--) {
        const ws = new Date(startOfThisWeek);
        ws.setDate(ws.getDate() - i * 7);
        const we = new Date(ws);
        we.setDate(we.getDate() + 7);
        weeklyBuckets.push({ start: ws, end: we, label: ws.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), volume: 0, count: 0 });
      }
      let thisWeekVolume = 0, thisWeekCount = 0;
      workouts.forEach((w) => {
        if (!w.date) return;
        const [y, m, d] = w.date.split('-').map(Number);
        const wDate = new Date(y, m - 1, d);
        const { totalVolume } = computeWorkoutStats(w);
        weeklyBuckets.forEach((b, idx) => {
          if (wDate >= b.start && wDate < b.end) {
            b.volume += totalVolume;
            b.count += 1;
            if (idx === weeklyBuckets.length - 1) { thisWeekVolume += totalVolume; thisWeekCount += 1; }
          }
        });
      });
      let weekStreak = 0;
      for (let i = weeklyBuckets.length - 1; i >= 0; i--) {
        if (weeklyBuckets[i].count > 0) weekStreak += 1;
        else if (i === weeklyBuckets.length - 1) continue;
        else break;
      }
      return { weeklyBuckets, thisWeekVolume: Math.round(thisWeekVolume), thisWeekCount, weekStreak };
    };

    // JSON Backup
    const buildBackupPayload = (userData) => ({
      app: 'IronPulse',
      version: 2,
      exportedAt: new Date().toISOString(),
      data: normalizeUserData(userData),
    });

    const parseAndValidateBackup = (rawText) => {
      let parsed;
      try { parsed = JSON.parse(rawText); } catch { throw new Error('File is not valid JSON.'); }
      if (!parsed || typeof parsed !== 'object') throw new Error('Backup JSON must be an object.');
      const rawData = parsed.data && typeof parsed.data === 'object' ? parsed.data : parsed;
      if (!Array.isArray(rawData.workouts) && !Array.isArray(rawData.bodyWeights) && !Array.isArray(rawData.customExercises) && !Array.isArray(rawData.measurements) && !Array.isArray(rawData.routines)) {
        throw new Error('JSON does not contain valid IronPulse workout, measurement, or routine arrays.');
      }
      return normalizeUserData(rawData);
    };

    const mergeBackupData = (current, incoming) => {
      const wMap = new Map();
      current.workouts.forEach((w) => wMap.set(w.id, w));
      incoming.workouts.forEach((w) => wMap.set(w.id, w));
      const bwMap = new Map();
      current.bodyWeights.forEach((b) => bwMap.set(b.date, b));
      incoming.bodyWeights.forEach((b) => bwMap.set(b.date, b));
      const measMap = new Map();
      (current.measurements || []).forEach((m) => measMap.set(m.date, m));
      (incoming.measurements || []).forEach((m) => measMap.set(m.date, m));
      const exMap = new Map();
      current.customExercises.forEach((e) => exMap.set(e.id, e));
      incoming.customExercises.forEach((e) => exMap.set(e.id, e));
      const rtnMap = new Map();
      (current.routines || []).forEach((r) => rtnMap.set(r.id, r));
      (incoming.routines || []).forEach((r) => rtnMap.set(r.id, r));
      return normalizeUserData({
        ...current,
        profile: {
          heightCm: current.profile.heightCm ?? incoming.profile.heightCm ?? null,
          age: current.profile.age ?? incoming.profile.age ?? null,
          sex: current.profile.sex || incoming.profile.sex || 'male',
          measurementUnit: current.profile.measurementUnit || incoming.profile.measurementUnit || 'cm',
        },
        workouts: Array.from(wMap.values()).sort((a, b) => (a.date < b.date ? 1 : -1)),
        bodyWeights: Array.from(bwMap.values()),
        measurements: Array.from(measMap.values()).sort((a, b) => (a.date < b.date ? 1 : -1)),
        customExercises: Array.from(exMap.values()),
        routines: Array.from(rtnMap.values()),
        updatedAt: new Date().toISOString(),
      });
    };

    // ========================================================================
    // 4. WEB AUDIO TIMER CHIME
    // ========================================================================
    let sharedAudioCtx = null;
    const getAudioCtx = () => {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
      return sharedAudioCtx;
    };
    const unlockAudioContext = () => {
      try {
        const ctx = getAudioCtx();
        if (ctx && ctx.state === 'suspended') ctx.resume();
      } catch {}
    };
    const playIndustrialChime = () => {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume();
        const pulse = (delay, freq, dur) => {
          const start = ctx.currentTime + delay;
          const oscMain = ctx.createOscillator();
          const oscHarm = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const harmGain = ctx.createGain();
          const gain = ctx.createGain();
          oscMain.type = 'triangle';
          oscMain.frequency.setValueAtTime(freq, start);
          oscHarm.type = 'square';
          oscHarm.frequency.setValueAtTime(freq * 2, start);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2600, start);
          harmGain.gain.setValueAtTime(0.22, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.24, start + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          oscMain.connect(filter);
          oscHarm.connect(harmGain);
          harmGain.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          oscMain.start(start);
          oscHarm.start(start);
          oscMain.stop(start + dur + 0.02);
          oscHarm.stop(start + dur + 0.02);
        };
        pulse(0, 880, 0.16);
        pulse(0.21, 880, 0.16);
        pulse(0.42, 1318.5, 0.28);
      } catch {}
    };

                  <label className="block text-[11px] font-mono uppercase tracking-widest text-slate-400 mb-1.5">Exercise Reference</label>
                  <select value={selectedExId} onChange={(e) => handleExerciseChange(e.target.value)} className="w-full bg-slate-950 border border-slate-700 px-3 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500">
                    <option value="custom">Manual / Any Barbell Lift</option>
                    {exercises.map((ex) => <option key={ex.id} value={ex.id}>{ex.name} ({ex.muscleGroup})</option>)}
                  </select>
                </div>
                <div className="sm:col-span-3">
                  <label className="block text-[11px] font-mono uppercase tracking-widest text-slate-400 mb-1.5">Weight ({unit})</label>
                  <input type="number" step="0.5" min="0" value={weight} onChange={(e) => setWeight(e.target.value)} className="w-full bg-slate-950 border border-slate-700 px-3 py-2.5 text-sm font-bold text-white font-mono focus:outline-none focus:border-orange-500" />
                </div>

                  <label className="block text-[11px] font-mono uppercase tracking-widest text-slate-400 mb-1.5">Reps</label>
                  <input type="number" min="1" max="36" value={reps} onChange={(e) => setReps(e.target.value)} className="w-full bg-slate-950 border border-slate-700 px-3 py-2.5 text-sm font-bold text-white font-mono focus:outline-none focus:border-orange-500" />

      const rawTargetNum = parseFloat(targetWeight) || 0;
      const barNum = parseFloat(barWeight) || 0;
      const perImplementTarget = isPair && pairInputType === 'combined' ? Math.round((rawTargetNum / 2) * 100) / 100 : rawTargetNum;

      const result = useMemo(() => calculateBarbellPlates(perImplementTarget, barNum, unit, isDumbbell), [perImplementTarget, barNum, unit, isDumbbell]);

      const totalDumbbells = isPair ? 2 : 1;

            <div className={`${isDumbbell ? (isPair ? 'w-14' : 'w-16 sm:w-20') : 'w-24 sm:w-36'} h-3 bg-slate-700 relative flex items-center justify-center`}>
              <span className="text-[10px] font-mono text-slate-300 bg-slate-950 px-1.5 py-0.5 border border-slate-800 whitespace-nowrap">{barNum}{unit}</span>
            </div>
            <div className="w-2 h-7 bg-slate-500 border-x border-slate-700" />

      return (

          <div className="bg-slate-900 border border-slate-700 max-w-2xl w-full max-h-[92vh] overflow-y-auto">
            <div className="sticky top-0 bg-slate-900 border-b border-slate-800 px-5 py-4 flex items-center justify-between gap-4 z-10">
              <div className="flex items-center gap-2.5">
                <Icons.Disc className="w-5 h-5 text-orange-500" />
                <div>
                  <h3 className="text-xl font-bold text-white">Plate Calculator</h3>
                  <div className="text-xs font-mono text-slate-400">
                    {mode === 'barbell' ? 'BARBELL PER-SIDE LOADER' : mode === 'single-db' ? '1 DUMBBELL SLEEVE LOADER' : '2 DUMBBELLS (PAIR) PLATE LOADER'} · {unit.toUpperCase()}
                  </div>
                </div>
              </div>
              <button onClick={onClose} className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white"><Icons.X className="w-5 h-5" /></button>
            </div>

        a.href = url;
        a.download = `ironpulse-backup-${todayISO()}.json`;

        const out = (e) => { if (panelRef.current && !panelRef.current.contains(e.target)) setOpen(false); };
        if (open) document.addEventListener('mousedown', out);
        return () => document.removeEventListener('mousedown', out);
      }, [open]);

      const formatted = formatTimerClock(remaining);
      const pct = duration > 0 ? Math.max(0, Math.min(100, (remaining / duration) * 100)) : 0;
      const isFinished = remaining === 0;
      const presets = [{ label: '30s', val: 30 }, { label: '60s', val: 60 }, { label: '90s', val: 90 }, { label: '2m', val: 120 }, { label: '3m', val: 180 }];

      return (
        <div className="relative" ref={panelRef}>
          <div className={`flex items-center gap-1 sm:gap-1.5 px-2.5 py-1 border ${isFinished || isRunning ? 'bg-orange-500/15 border-orange-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-200'}`}>

              <span className="font-mono text-sm font-bold tracking-tight tabular-nums">{formatted}</span>
            </button>
            {isRunning ? (
              <button onClick={onPause} className="p-1.5 bg-slate-800 hover:bg-slate-700 text-white"><Icons.Pause className="w-3.5 h-3.5" /></button>

              <button onClick={() => { unlockAudioContext(); onStart(remaining === 0 ? duration : undefined); }} className="p-1.5 bg-orange-500 hover:bg-orange-400 text-white"><Icons.Play className="w-3.5 h-3.5" /></button>
            )}
            <button onClick={onReset} className="p-1.5 hover:bg-slate-800 text-slate-300 hover:text-white"><Icons.RotateCcw className="w-3.5 h-3.5" /></button>
            <button onClick={onToggleMute} className="hidden sm:flex p-1.5 hover:bg-slate-800 text-slate-300 hover:text-white">
              {muted ? <Icons.VolumeX className="w-3.5 h-3.5 text-orange-400" /> : <Icons.Volume2 className="w-3.5 h-3.5 text-white" />}
            </button>
            <button onClick={() => setOpen((o) => !o)} className="p-1 hover:bg-slate-800 text-slate-400 hover:text-white">
              <Icons.ChevronDown className={`w-3.5 h-3.5 transition-transform ${open ? 'rotate-180' : ''}`} />
            </button>
          </div>
          <div className="h-0.5 w-full bg-slate-800 overflow-hidden mt-0.5"><div className={`h-full transition-all duration-200 ${isFinished ? 'bg-white' : 'bg-orange-500'}`} style={{ width: `${pct}%` }} /></div>
          {open && (
            <div className="absolute right-0 mt-2 w-72 bg-slate-900 border border-slate-700 p-4 z-50">

              <div className="grid grid-cols-5 gap-1.5 mb-3">
                {presets.map((p) => (
                  <button key={p.val} onClick={() => onSetDuration(p.val)} className={`py-1.5 text-xs font-mono font-semibold border ${duration === p.val ? 'bg-orange-500 text-white border-orange-500' : 'bg-slate-800 text-slate-200 border-slate-700'}`}>{p.label}</button>
                ))}
              </div>
              <form onSubmit={(e) => { e.preventDefault(); const v = parseInt(customSec, 10); if (!isNaN(v) && v >= 5 && v <= 900) onSetDuration(v); }} className="flex gap-2 mb-3">

                <button type="submit" className="px-3 py-1.5 bg-slate-800 text-xs font-semibold text-white border border-slate-600">Set</button>
              </form>
              <div className="flex gap-2 mb-2">
                <button onClick={() => onAdjustSeconds(-15)} className="flex-1 py-1.5 bg-slate-800 text-xs font-mono text-slate-200">−15s</button>
                <button onClick={() => onAdjustSeconds(15)} className="flex-1 py-1.5 bg-slate-800 text-xs font-mono text-slate-200">+15s</button>
              </div>
              <div className="flex gap-2">
                <button onClick={() => { unlockAudioContext(); onStart(duration); setOpen(false); }} className="flex-1 py-2 bg-orange-500 text-white text-xs font-bold flex items-center justify-center gap-1.5"><Icons.Play className="w-3.5 h-3.5" /> Restart ({duration}s)</button>
                <button onClick={onReset} className="px-3 py-2 bg-slate-800 text-slate-200 text-xs font-semibold">Reset</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const ProgressionChart = ({ points, unit = 'kg' }) => {
      const [metric, setMetric] = useState('topWeight');
      const [hoveredIdx, setHoveredIdx] = useState(null);
      if (!points || points.length === 0) {
        return (
          <div className="bg-slate-950 border border-slate-800 p-6 text-center">
            <Icons.TrendingUp className="w-8 h-8 text-slate-600 mx-auto mb-2" />
            <p className="text-sm font-medium text-slate-300">No logged sessions yet</p>
            <p className="text-xs text-slate-500 mt-1">Complete at least one workout with this exercise to plot your progression curve.</p>
          </div>
        );
      }
      const width = 560, height = 210, padL = 48, padR = 20, padT = 20, padB = 34, innerW = width - padL - padR, innerH = height - padT - padB;
      const values = points.map((p) => (metric === 'topWeight' ? p.topWeight : p.volume));
      const rawMin = Math.min(...values), rawMax = Math.max(...values);
      const padding = rawMax === rawMin ? Math.max(5, rawMax * 0.15) : (rawMax - rawMin) * 0.18;
      const minVal = Math.max(0, Math.floor(rawMin - padding)), maxVal = Math.ceil(rawMax + padding), range = Math.max(1, maxVal - minVal);
      const coords = points.map((p, idx) => ({
        x: points.length === 1 ? padL + innerW / 2 : padL + (idx / (points.length - 1)) * innerW,
        y: padT + innerH - (((metric === 'topWeight' ? p.topWeight : p.volume) - minVal) / range) * innerH,
        val: metric === 'topWeight' ? p.topWeight : p.volume,
        point: p,
      }));
      const linePath = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
      const areaPath = coords.length > 1 ? `${linePath} L ${coords[coords.length - 1].x.toFixed(1)} ${padT + innerH} L ${coords[0].x.toFixed(1)} ${padT + innerH} Z` : '';
      const strokeColor = metric === 'topWeight' ? '#e11d48' : '#ffffff';
      const yTicks = [0, 0.5, 1].map((t) => ({ y: padT + innerH - t * innerH, label: Math.round(minVal + t * range) }));
      const activePoint = hoveredIdx !== null ? coords[hoveredIdx] : coords[coords.length - 1];

      return (
        <div className="bg-slate-950 border border-slate-800 p-4">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div className="flex items-center gap-1 bg-slate-900 p-1 border border-slate-800">
              <button onClick={() => setMetric('topWeight')} className={`px-3 py-1 text-xs font-semibold ${metric === 'topWeight' ? 'bg-orange-500 text-white' : 'text-slate-400 hover:text-white'}`}>Top Weight ({unit})</button>
              <button onClick={() => setMetric('volume')} className={`px-3 py-1 text-xs font-semibold ${metric === 'volume' ? 'bg-white text-slate-950' : 'text-slate-400 hover:text-white'}`}>Session Volume ({unit})</button>
            </div>
            {activePoint && (
              <div className="text-xs font-mono">
                <span className="text-slate-400">{formatShortDate(activePoint.point.date)}: </span>
                <strong className="text-white">{activePoint.val.toLocaleString()} {unit}</strong>
                {activePoint.point.bestSet && <span className="text-slate-400 ml-1.5">(Best: {activePoint.point.bestSet.weight}{unit}×{activePoint.point.bestSet.reps})</span>}
              </div>
            )}
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto select-none">
            {yTicks.map((t, i) => (<g key={i}><line x1={padL} x2={width - padR} y1={t.y} y2={t.y} stroke="#27272a" strokeDasharray="4 4" /><text x={padL - 8} y={t.y + 4} textAnchor="end" className="fill-slate-500 text-[10px] font-mono">{t.label}</text></g>))}
            {areaPath && <path d={areaPath} fill={strokeColor} fillOpacity="0.07" />}
            {coords.length > 1 && <path d={linePath} fill="none" stroke={strokeColor} strokeWidth="2.5" strokeLinejoin="miter" />}
            {coords.map((c, idx) => {
              const isHovered = hoveredIdx === idx;
              const showLabel = coords.length <= 6 || idx === 0 || idx === coords.length - 1 || idx === Math.floor(coords.length / 2);
              return (
                <g key={idx} onMouseEnter={() => setHoveredIdx(idx)} onMouseLeave={() => setHoveredIdx(null)} className="cursor-pointer">
                  <rect x={c.x - 14} y={c.y - 14} width="28" height="28" fill="transparent" />
                  <rect x={c.x - (isHovered ? 5 : 3.5)} y={c.y - (isHovered ? 5 : 3.5)} width={isHovered ? 10 : 7} height={isHovered ? 10 : 7} fill={isHovered ? '#ffffff' : strokeColor} />
                  {showLabel && <text x={c.x} y={height - 10} textAnchor="middle" className="fill-slate-400 text-[10px] font-mono">{formatShortDate(c.point.date)}</text>}
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    const BodyTrendChart = ({ entries, unit }) => {
      const [range, setRange] = useState('90');
      const [hoveredIdx, setHoveredIdx] = useState(null);
      const points = useMemo(() => {
        if (range === 'all') return entries;
        const cutoff = daysAgoISO(Number(range));
        return entries.filter((e) => e.date >= cutoff);
      }, [entries, range]);

      const ranges = [{ id: '30', label: '30D' }, { id: '90', label: '90D' }, { id: 'all', label: 'All' }];
      const width = 640, height = 220, padL = 48, padR = 20, padT = 20, padB = 34, innerW = width - padL - padR, innerH = height - padT - padB;
      let chart = null;
      if (points.length > 0) {
        const values = points.map((p) => p.value);
        const rawMin = Math.min(...values), rawMax = Math.max(...values);
        const pad = rawMax === rawMin ? 1 : (rawMax - rawMin) * 0.2;
        const minVal = Math.floor(rawMin - pad), maxVal = Math.ceil(rawMax + pad), span = Math.max(1, maxVal - minVal);
        const coords = points.map((p, i) => ({
          x: points.length === 1 ? padL + innerW / 2 : padL + (i / (points.length - 1)) * innerW,
          y: padT + innerH - ((p.value - minVal) / span) * innerH,
          p,
        }));
        const linePath = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
        const yTicks = [0, 0.5, 1].map((t) => ({ y: padT + innerH - t * innerH, label: round1(minVal + t * span) }));
        chart = { coords, linePath, yTicks };
      }
      const active = chart ? (hoveredIdx !== null ? chart.coords[hoveredIdx] : chart.coords[chart.coords.length - 1]) : null;

      return (
        <div className="bg-slate-900 border border-slate-800 p-4">
          <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
            <div className="flex border border-slate-800">
              {ranges.map((r) => (
                <button key={r.id} onClick={() => setRange(r.id)} className={`px-3 py-1 text-xs font-bold ${range === r.id ? 'bg-white text-slate-950' : 'text-slate-400 hover:text-white'}`}>{r.label}</button>
              ))}
            </div>
            {active && <div className="text-xs font-mono"><span className="text-slate-400">{formatShortDate(active.p.date)} </span><span className="font-bold text-white">{active.p.value} {unit}</span></div>}
          </div>
          {!chart ? (
            <div className="py-10 text-center">
              <p className="text-sm font-semibold text-slate-300">No entries in this range</p>
              <p className="text-xs text-slate-400 mt-1">Log a weigh-in or widen the range.</p>
            </div>
          ) : (
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto select-none">
              {chart.yTicks.map((t, i) => (<g key={i}><line x1={padL} x2={width - padR} y1={t.y} y2={t.y} stroke="#27272a" /><text x={padL - 8} y={t.y + 4} textAnchor="end" className="fill-slate-400 text-[10px] font-mono">{t.label}</text></g>))}
              {chart.coords.length > 1 && <path d={chart.linePath} fill="none" stroke="#e11d48" strokeWidth="2" strokeLinejoin="miter" />}
              {chart.coords.map((c, i) => {
                const hovered = hoveredIdx === i;
                const showLabel = chart.coords.length <= 6 || i === 0 || i === chart.coords.length - 1 || i === Math.floor(chart.coords.length / 2);
                return (
                  <g key={c.p.id} onMouseEnter={() => setHoveredIdx(i)} onMouseLeave={() => setHoveredIdx(null)} className="cursor-pointer">
                    <rect x={c.x - 14} y={c.y - 14} width="28" height="28" fill="transparent" />
                    <rect x={c.x - (hovered ? 5 : 3.5)} y={c.y - (hovered ? 5 : 3.5)} width={hovered ? 10 : 7} height={hovered ? 10 : 7} fill={hovered ? '#ffffff' : '#e11d48'} />
                    {showLabel && <text x={c.x} y={height - 10} textAnchor="middle" className="fill-slate-400 text-[10px] font-mono">{formatShortDate(c.p.date)}</text>}
                  </g>
                );
              })}
            </svg>
          )}
        </div>
      );
    };

                  <span className="text-orange-400 uppercase font-bold">{exercise.muscleGroup}</span>
                  {exercise.equipment && <><span>·</span><span>{exercise.equipment}</span></>}

                </div>

            <div className="p-5 space-y-5">

                  <div className="flex flex-wrap gap-1.5">

                <div className="bg-slate-950 p-3"><div className="text-[11px] font-mono uppercase text-slate-400">Est. 1RM</div><div className="text-lg font-bold text-orange-400 font-mono mt-0.5">{stats.best1RM > 0 ? `${stats.best1RM} ${unit}` : '—'}</div></div>

                )}

    const ExercisePickerModal = ({ exercises, onSelect, onClose, onCreateCustom }) => {

      const filtered = useMemo(() => exercises.filter((ex) => {

            <button onClick={() => onNavigate('body')} className="text-left col-span-2 lg:col-span-1 bg-slate-900 border border-slate-800 hover:border-slate-600 p-4">
              <div className="flex items-center justify-between text-slate-400 text-xs font-medium"><span>Bodyweight</span><Icons.Scale className="w-4 h-4 text-slate-300" /></div>
              <div className="text-2xl font-extrabold text-white mt-2 font-mono tabular-nums">{bodyLatest ? bodyLatest.value : '—'} <span className="text-sm font-semibold text-slate-400">{unit}</span></div>
              <div className="text-xs text-slate-500 mt-1 truncate font-mono">{bodyCategory ? `BMI ${bodyBMI} · ${bodyCategory.label}` : 'Add weight & height'}</div>
            </button>
          </div>

          {!activeWorkout && (
            <div className="bg-slate-900 border border-slate-800 p-4 sm:p-5">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-sm font-bold text-white uppercase tracking-wider">Quick-Start Workout Templates</h2>
                <button onClick={onStartBlankWorkout} className="text-xs font-semibold text-orange-400 hover:text-orange-300">Or build custom →</button>
              </div>
              <div className="grid sm:grid-cols-3 gap-3">
                {templates.map((tpl) => (
                  <button key={tpl.name} onClick={() => onStartTemplateWorkout(tpl)} className="text-left p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-orange-500/60 group">
                    <div className="text-sm font-bold text-white group-hover:text-orange-400">{tpl.name}</div>
                    <div className="text-xs font-mono text-slate-400 mt-1">{tpl.ids.length} exercises pre-loaded</div>
                  </button>
                ))}
              </div>
            </div>
          )}

          <div className="grid lg:grid-cols-12 gap-5">
            <div className="lg:col-span-7 bg-slate-900 border border-slate-800 p-5">
              <div className="flex items-center justify-between mb-4">
                <div><h2 className="text-base font-bold text-white">6-Week Volume Trend</h2><p className="text-xs text-slate-400">Total weight lifted per week ({unit})</p></div>
                <button onClick={() => onNavigate('progress')} className="text-xs font-semibold text-slate-300 hover:text-white">Exercise Insights →</button>
              </div>
              {workouts.length === 0 ? (
                <div className="h-44 flex flex-col items-center justify-center text-center bg-slate-950 border border-slate-800 p-4">
                  <Icons.BarChart className="w-7 h-7 text-slate-600 mb-2" />
                  <p className="text-sm text-slate-300 font-medium">No weekly volume yet</p>
                  <p className="text-xs text-slate-500 mt-0.5">Complete your first workout to populate your 6-week volume chart.</p>

              ) : (
                <div className="h-48 flex items-end gap-2 sm:gap-4 pt-6 pb-2 px-2 bg-slate-950 border border-slate-800">
                  {weeklyBuckets.map((b, i) => {
                    const hPct = Math.max(6, Math.round((b.volume / maxWeeklyVol) * 100));
                    const isCurrent = i === weeklyBuckets.length - 1;
                    return (
                      <div key={b.label} className="flex-1 flex flex-col items-center h-full justify-end group">
                        <div className="text-[10px] font-mono text-slate-400 mb-1 opacity-80 group-hover:opacity-100">{b.volume > 0 ? `${(b.volume / 1000).toFixed(1)}k` : '0'}</div>
                        <div className="w-full max-w-[44px] flex-1 flex items-end"><div className={`w-full ${b.volume === 0 ? 'bg-slate-800' : isCurrent ? 'bg-orange-500' : 'bg-slate-600'}`} style={{ height: b.volume === 0 ? '4px' : `${hPct}%` }} title={`${b.label}: ${b.volume.toLocaleString()} ${unit} (${b.count} workouts)`} /></div>
                        <div className="text-[10px] font-mono text-slate-400 mt-2 truncate max-w-full">{b.label}</div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <div className="lg:col-span-5 bg-slate-900 border border-slate-800 p-5">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-base font-bold text-white flex items-center gap-2"><Icons.Award className="w-4 h-4 text-orange-400" /> Personal Records</h2>
                <button onClick={() => onNavigate('progress')} className="text-xs font-semibold text-orange-400 hover:text-orange-300">View All →</button>
              </div>
              {topPRs.length === 0 ? (
                <div className="text-center py-10 bg-slate-950 border border-slate-800 px-4">
                  <Icons.Award className="w-7 h-7 text-slate-600 mx-auto mb-2" />
                  <p className="text-sm text-slate-300 font-medium">No PRs recorded yet</p>
                  <p className="text-xs text-slate-500 mt-1">Log completed sets with weight & reps to calculate your best 1RM lifts.</p>
                </div>
              ) : (
                <div className="space-y-2">
                  {topPRs.map((pr) => (
                    <button key={pr.id} onClick={() => pr.exercise && onSelectExercise(pr.exercise)} className="w-full text-left flex items-center justify-between p-3 bg-slate-950 hover:bg-slate-800 border border-slate-800">
                      <div className="min-w-0 pr-2">
                        <div className="text-sm font-semibold text-white truncate">{pr.name}</div>
                        <div className="text-xs font-mono text-slate-400">Best Set: {pr.bestSet.weight}{unit} × {pr.bestSet.reps}</div>
                      </div>
                      <div className="text-right shrink-0">
                        <div className="text-sm font-extrabold text-orange-400 font-mono">{pr.best1RM} {unit}</div>
                        <div className="text-[10px] font-mono text-slate-500 uppercase">Est. 1RM</div>
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 p-5">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-base font-bold text-white">Recent Workouts</h2>
              <button onClick={() => onNavigate('history')} className="text-xs font-semibold text-orange-400 hover:text-orange-300">Full History →</button>
            </div>
            {recentWorkouts.length === 0 ? (
              <div className="text-center py-8 bg-slate-950 border border-slate-800">
                <p className="text-sm font-medium text-slate-300">Your workout log is empty</p>
                <p className="text-xs text-slate-500 mt-1 mb-4">Build your first workout or pick a quick-start template above.</p>
                <button onClick={onStartBlankWorkout} className="px-4 py-2 bg-orange-500 text-white text-xs font-bold">+ Start First Workout</button>
              </div>
            ) : (
              <div className="grid sm:grid-cols-2 gap-3">
                {recentWorkouts.map((w) => {
                  const st = computeWorkoutStats(w);
                  return (
                    <button key={w.id} onClick={() => onOpenWorkoutHistory(w)} className="text-left p-4 bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <div className="text-xs font-mono font-semibold text-orange-400">{formatDateLabel(w.date)}</div>
                        <div className="text-sm font-bold text-white truncate mt-0.5">{w.name}</div>
                        <div className="text-xs font-mono text-slate-400 mt-1">{w.exercises.length} exercises · {st.completedSets} sets · {st.totalVolume.toLocaleString()} {unit}</div>
                      </div>
                      <Icons.ChevronRight className="w-4 h-4 text-slate-500 shrink-0" />
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    };

    const WorkoutView = ({ workout, pastWorkouts, allExercises, unit, autoStartRest, restRunning, warmupFocus, onChangeWarmupFocus, onToggleAutoStartRest, onUpdateWorkout, onFinishWorkout, onDiscardWorkout, onStartRestTimer, onStopRestTimer, onSaveAsRoutine, onOpenExercisePicker, onInspectExercise, onOpen1RMCalc, onOpenPlateCalc, onNotify }) => {
      const [nowMs, setNowMs] = useState(() => Date.now());
      const [warmupOpen, setWarmupOpen] = useState(true);
      const [checkedWarmups, setCheckedWarmups] = useState({});
      const hasActiveRestEntry = Boolean(restRunning && workout?.restLog?.some((entry) => entry.status === 'resting'));

      useEffect(() => {
        if (!workout || workout.editingHistoryId) return;
        setNowMs(Date.now());
        if (workout.isPaused && !hasActiveRestEntry) return;
        const id = setInterval(() => setNowMs(Date.now()), 1000);
        return () => clearInterval(id);
      }, [workout?.id, workout?.startedAt, workout?.editingHistoryId, workout?.isPaused, hasActiveRestEntry]);

      const elapsedMs = useMemo(() => getWorkoutElapsedMs(workout, nowMs), [workout, nowMs]);
      const preLiftWarmups = COMMON_WARMUPS;

      if (!workout) {
        return (
          <div className="bg-slate-900 border border-slate-800 p-8 sm:p-12 text-center max-w-xl mx-auto mt-6">
            <div className="w-14 h-14 bg-orange-500/15 border border-orange-500/40 text-orange-400 flex items-center justify-center mx-auto mb-4"><Icons.Dumbbell className="w-7 h-7" /></div>
            <h2 className="text-xl font-extrabold text-white">No Active Workout</h2>
            <p className="text-sm text-slate-400 mt-2 mb-6">Start a blank workout to pick your date, name your session, add exercises, and log live sets with automatic PR detection and overload targets.</p>
            <div className="flex flex-wrap items-center justify-center gap-3">
              <button onClick={() => onUpdateWorkout({ id: `w-${uid()}`, name: 'My Workout', date: todayISO(), notes: '', exercises: [], startedAt: new Date().toISOString() })} className="px-6 py-3 bg-orange-500 hover:bg-orange-400 text-white font-extrabold text-sm inline-flex items-center gap-2"><Icons.Plus className="w-4 h-4" /> Build New Workout</button>
              <button onClick={() => onOpen1RMCalc()} className="px-4 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-sm inline-flex items-center gap-2"><Icons.Calculator className="w-4 h-4 text-orange-400" /> 1RM Calc</button>
              <button onClick={() => onOpenPlateCalc()} className="px-4 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-sm inline-flex items-center gap-2"><Icons.Disc className="w-4 h-4 text-orange-400" /> Plate Calc</button>
            </div>
          </div>
        );
      }

      const stats = computeWorkoutStats(workout);
      const isEditingExisting = Boolean(workout.editingHistoryId);
      const comparisonHistory = isEditingExisting ? pastWorkouts.filter((w) => w.id !== workout.editingHistoryId) : pastWorkouts;
      const restLog = workout.restLog || [];
      const updateMeta = (field, val) => onUpdateWorkout({ ...workout, [field]: val });

      const handleTogglePause = () => {
        const now = Date.now();
        if (workout.isPaused) {
          const pausedDelta = workout.pausedAt ? Math.max(0, now - new Date(workout.pausedAt).getTime()) : 0;
          onUpdateWorkout({ ...workout, isPaused: false, pausedAt: undefined, pausedTotalMs: (workout.pausedTotalMs || 0) + pausedDelta });
        } else {
          onUpdateWorkout({ ...workout, isPaused: true, pausedAt: new Date(now).toISOString() });
        }
        setNowMs(now);
      };

      const handleAddSet = (exIdx) => {
        const updated = { ...workout, exercises: [...workout.exercises] };
        const target = { ...updated.exercises[exIdx] };
        const workingSets = target.sets.filter((s) => !s.isWarmup);
        const lastSet = workingSets[workingSets.length - 1] || target.sets[target.sets.length - 1];
        target.sets = [
          ...target.sets,
          {
            id: `set-${uid()}`,
            weight: lastSet ? (lastSet.weight === '' ? (lastSet.ghostWeight ?? 0) : lastSet.weight) : 0,
            reps: lastSet ? (lastSet.reps === '' ? (lastSet.ghostReps ?? 8) : lastSet.reps) : 8,
            completed: false,
          },
        ];
        updated.exercises[exIdx] = target;
        onUpdateWorkout(updated);
      };

      const getExerciseWarmupPlan = (ex) => {
        const workingSets = ex.sets.filter((s) => !s.isWarmup);
        let enteredWeight = 0;
        for (const s of workingSets) {
          if (s.weight !== '' && s.weight !== null && s.weight !== undefined) {
            const val = Number(s.weight) || 0;
            if (val > enteredWeight) enteredWeight = val;
          }
        }
        if (enteredWeight <= 0) return null;
        const warmups = buildWarmupSets(enteredWeight, unit);
        if (warmups.length === 0) return null;
        return { targetWeight: enteredWeight, warmups, workingSets };
      };

      const handleInsertWarmupSets = (exIdx) => {
        const updated = { ...workout, exercises: [...workout.exercises] };
        const ex = { ...updated.exercises[exIdx] };
        const plan = getExerciseWarmupPlan(ex);
        if (!plan) {
          if (onNotify) onNotify(`Enter ${unit} weight in a normal set first to calculate your warmup set.`, 'error');
          return;
        }
        const { targetWeight, warmups, workingSets } = plan;
        if (onNotify) {
          onNotify(`Inserted 1 warmup set (${warmups[0].weight}${unit} × ${warmups[0].reps}) for ${targetWeight}${unit} normal set.`);
        }
        ex.sets = [...warmups, ...workingSets];
        updated.exercises[exIdx] = ex;
        onUpdateWorkout(updated);
      };

      const handleRemoveSet = (exIdx, setIdx) => {
        const updated = { ...workout, exercises: [...workout.exercises] };
        updated.exercises[exIdx] = { ...updated.exercises[exIdx], sets: updated.exercises[exIdx].sets.filter((_, i) => i !== setIdx) };
        onUpdateWorkout(updated);
      };

      const handleUpdateSet = (exIdx, setIdx, field, value) => {
        const updated = { ...workout, exercises: [...workout.exercises] };
        const target = { ...updated.exercises[exIdx], sets: [...updated.exercises[exIdx].sets] };
        const nextSet = { ...target.sets[setIdx], [field]: value };
        if (field === 'completed' && value === true) {
          if (nextSet.weight === '' && nextSet.ghostWeight !== undefined) nextSet.weight = nextSet.ghostWeight;
          if (nextSet.reps === '' && nextSet.ghostReps !== undefined) nextSet.reps = nextSet.ghostReps;
        }
        target.sets[setIdx] = nextSet;
        updated.exercises[exIdx] = target;
        if (field === 'completed' && value === true && updated.restLog?.length) {
          const now = Date.now();
          const nowIso = new Date(now).toISOString();
          updated.restLog = updated.restLog.map((entry) =>
            entry.status === 'resting'
              ? { ...entry, endedAt: nowIso, durationSeconds: Math.max(1, Math.round((now - new Date(entry.startedAt).getTime()) / 1000)), status: 'next' }
              : entry
          );
        }
        onUpdateWorkout(updated);
        if (field === 'completed' && value === true && !nextSet.isWarmup && autoStartRest) onStartRestTimer(`${target.name} · Set ${setIdx + 1}`);
      };

      const handleRemoveExercise = (exIdx) => onUpdateWorkout({ ...workout, exercises: workout.exercises.filter((_, i) => i !== exIdx) });

      return (
        <div className="space-y-5 pb-12">
          <div className="bg-slate-900 border border-slate-800 p-4 sm:p-5 space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <span className="px-2.5 py-1 text-xs font-mono font-bold uppercase tracking-wider bg-slate-950 text-orange-400 border border-orange-500/50">{isEditingExisting ? '[ EDITING SAVED ]' : workout.isPaused ? '[ PAUSED ]' : '[ LIVE SESSION ]'}</span>
                {!isEditingExisting && (
                  <div className="inline-flex items-stretch border border-slate-800 bg-slate-950">
                    <span className={`px-2.5 py-1 text-xs font-mono font-bold flex items-center gap-1.5 ${workout.isPaused ? 'text-orange-400' : 'text-slate-300'}`}>
                      <Icons.Clock className="w-3.5 h-3.5 text-orange-400" />{formatElapsed(elapsedMs)}
                    </span>
                    <button type="button" onClick={handleTogglePause} className={`px-2.5 py-1 border-l border-slate-800 text-[11px] font-mono font-bold flex items-center gap-1 ${workout.isPaused ? 'bg-orange-500 hover:bg-orange-400 text-white' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white'}`} title={workout.isPaused ? 'Resume workout timer' : 'Pause workout timer'}>
                      {workout.isPaused ? <><Icons.Play className="w-3 h-3" /> Resume</> : <><Icons.Pause className="w-3 h-3" /> Pause</>}
                    </button>
                  </div>
                )}
                <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer ml-1 select-none">
                  <input type="checkbox" checked={autoStartRest} onChange={onToggleAutoStartRest} />
                  Auto-start rest on set done
                </label>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <button type="button" onClick={() => onOpen1RMCalc()} className="px-3 py-2 bg-slate-950 hover:bg-slate-800 border border-slate-700 text-slate-200 hover:text-white text-xs flex items-center gap-1.5 whitespace-nowrap"><Icons.Calculator className="w-3.5 h-3.5 text-orange-400" /> 1RM Calc</button>
                <button type="button" onClick={() => onOpenPlateCalc()} className="px-3 py-2 bg-slate-950 hover:bg-slate-800 border border-slate-700 text-slate-200 hover:text-white text-xs flex items-center gap-1.5 whitespace-nowrap"><Icons.Disc className="w-3.5 h-3.5 text-orange-400" /> Plate Calc</button>
                <button type="button" onClick={onDiscardWorkout} className="px-3 py-2 bg-slate-800 hover:bg-rose-950 hover:text-orange-400 text-slate-300 text-xs font-semibold whitespace-nowrap">{isEditingExisting ? 'Cancel Edit' : 'Discard'}</button>
                <button type="button" onClick={onFinishWorkout} className="px-4 py-2 bg-white hover:bg-slate-300 text-slate-950 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 whitespace-nowrap"><Icons.Check className="w-4 h-4" />{isEditingExisting ? 'Save Changes' : 'Finish Workout'}</button>
              </div>
            </div>
            <div className="grid sm:grid-cols-12 gap-3">
              <div className="sm:col-span-8">
                <label className="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">Workout Name</label>
                <input type="text" value={workout.name} onChange={(e) => updateMeta('name', e.target.value)} placeholder="e.g. Push Day A, Upper Strength" className="w-full bg-slate-950 border border-slate-700 px-3.5 py-2 text-base font-bold text-white focus:outline-none focus:border-orange-500" />
              </div>
              <div className="sm:col-span-4">
                <label className="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">Workout Date</label>
                <input type="date" value={workout.date} onChange={(e) => updateMeta('date', e.target.value)} className="w-full bg-slate-950 border border-slate-700 px-3.5 py-2 text-sm text-white focus:outline-none focus:border-orange-500" />
              </div>
            </div>
            <div className="grid grid-cols-3 gap-px bg-slate-800 border border-slate-800">
              <div className="bg-slate-950 p-3"><div className="text-[11px] font-mono text-slate-400 uppercase font-semibold">Total Volume</div><div className="text-lg sm:text-xl font-extrabold text-white tabular-nums font-mono">{stats.totalVolume.toLocaleString()} <span className="text-xs">{unit}</span></div></div>
              <div className="bg-slate-950 p-3"><div className="text-[11px] font-mono text-slate-400 uppercase font-semibold">Sets Done</div><div className="text-lg sm:text-xl font-extrabold text-orange-400 tabular-nums font-mono">{stats.completedSets} <span className="text-xs text-slate-500">/ {stats.totalSets}</span></div></div>
              <div className="bg-slate-950 p-3"><div className="text-[11px] font-mono text-slate-400 uppercase font-semibold">Exercises</div><div className="text-lg sm:text-xl font-extrabold text-white tabular-nums font-mono">{workout.exercises.length}</div></div>
            </div>
            <div>
              <input type="text" value={workout.notes || ''} onChange={(e) => updateMeta('notes', e.target.value)} placeholder="Session notes (energy level, cues, adjustments)..." className="w-full bg-slate-950 border border-slate-800 px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-slate-600" />
            </div>
          </div>

          {!isEditingExisting && (
            <div className="bg-slate-900 border border-slate-800">
              <div className="px-4 py-3 flex flex-wrap items-center justify-between gap-2 border-b border-slate-800">
                <button type="button" onClick={() => setWarmupOpen((o) => !o)} className="flex items-center gap-2 text-left">
                  <Icons.Flame className="w-4 h-4 text-orange-400" />
                  <span className="text-xs font-mono font-bold uppercase tracking-wider text-white">Pre-Lift Essential Warmups ({preLiftWarmups.filter((d) => checkedWarmups[d.id]).length}/{preLiftWarmups.length})</span>
                  <Icons.ChevronDown className={`w-4 h-4 text-slate-400 transition-transform ${warmupOpen ? 'rotate-180' : ''}`} />
                </button>
                <span className="text-[10px] font-mono uppercase text-slate-400">Full Body + Joint Prep</span>
              </div>
              {warmupOpen && (
                <div className="p-3 sm:p-4 grid sm:grid-cols-2 gap-2">
                  {preLiftWarmups.map((drill) => {
                    const done = Boolean(checkedWarmups[drill.id]);
                    return (
                      <button key={drill.id} type="button" onClick={() => setCheckedWarmups((prev) => ({ ...prev, [drill.id]: !prev[drill.id] }))} className={`text-left p-3 border flex items-start gap-2.5 transition ${done ? 'bg-slate-950 border-white/50 opacity-75' : 'bg-slate-950 border-slate-800 hover:border-slate-600'}`}>
                        <div className={`w-4 h-4 mt-0.5 border flex items-center justify-center shrink-0 ${done ? 'bg-white border-white text-slate-950' : 'bg-slate-900 border-slate-600 text-transparent'}`}><Icons.Check className="w-3 h-3" /></div>
                        <div className="min-w-0">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="text-xs font-bold text-white leading-snug">{drill.name}</span>
                            <span className="text-[10px] font-mono text-orange-400">{drill.durationOrReps}</span>
                          </div>
                          <p className="text-[11px] text-slate-400 mt-0.5 leading-snug">{drill.cue}</p>
                        </div>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {workout.exercises.length === 0 ? (
            <div className="bg-slate-900 border border-dashed border-slate-700 p-8 text-center">
              <p className="text-sm font-semibold text-slate-300">No exercises added yet</p>
              <p className="text-xs text-slate-500 mt-1 mb-4">Add exercises from the built-in catalog or your custom list to start logging sets.</p>
              <button onClick={onOpenExercisePicker} className="px-5 py-2.5 bg-orange-500 hover:bg-orange-400 text-white text-sm font-bold inline-flex items-center gap-2"><Icons.Plus className="w-4 h-4" /> Add Exercise</button>
            </div>
          ) : (
            <div className="space-y-4">
              {workout.exercises.map((ex, exIdx) => {
                const meta = allExercises.find((e) => e.id === ex.exerciseId);
                const target = getNextTargetSuggestion(ex.exerciseId, comparisonHistory, unit);
                const setPRFlags = ex.sets.map((s) => isSetPersonalRecord(ex.exerciseId, s, comparisonHistory));
                const exerciseHasPR = setPRFlags.some((r) => r.isPR);
                const topSetWeight = ex.sets.reduce((mx, s) => {
                  const wt = s.weight === '' ? Number(s.ghostWeight) || 0 : Number(s.weight) || 0;
                  return Math.max(mx, wt);
                }, 0);
                let workingCounter = 0;
                let warmupCounter = 0;
                const isFirstForMuscle = workout.exercises.findIndex((e) => e.muscleGroup === ex.muscleGroup) === exIdx;
                const warmupPlan = isFirstForMuscle ? getExerciseWarmupPlan(ex) : null;

                                {ex.sets.length > 1 && <button type="button" onClick={() => handleRemoveSet(exIdx, setIdx)} className="p-1 text-slate-500 hover:text-orange-400" title="Remove set"><Icons.X className="w-3.5 h-3.5" /></button>}

                  ))}
                </div>
              </div>
              {restLog.length === 0 ? (
                <div className="bg-slate-950 border border-slate-800 px-3.5 py-3 text-xs text-slate-400 font-mono">

                <div className="space-y-1.5">
                  {restLog.map((entry, idx) => {
                    const isLive = restRunning && entry.status === 'resting';

                    return (
                      <div key={entry.id} className={`px-3 py-2 bg-slate-950 border flex flex-wrap items-center justify-between gap-2 text-xs font-mono ${isLive ? 'border-orange-500/60' : 'border-slate-800'}`}>
                        <div className="flex items-center gap-2.5 min-w-0">
                          <span className="text-slate-500">#{idx + 1}</span>
                          <span className="text-slate-300">{formatTimeOfDay(entry.startedAt)}</span>

                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <span className="text-slate-500">Target {entry.plannedSeconds}s</span>

                            <span className="px-2 py-0.5 bg-orange-500/20 text-orange-400 font-bold">Resting {formatElapsed(liveSecs * 1000)}</span>
                          ) : entry.status === 'stopped' ? (
                            <span className="px-2 py-0.5 bg-slate-900 border border-slate-700 text-orange-400 font-bold">Stopped {formatElapsed(liveSecs * 1000)}</span>
                          ) : (
                            <span className="px-2 py-0.5 bg-slate-900 border border-slate-700 text-white font-bold">Took {formatElapsed(liveSecs * 1000)}{entry.status === 'next' ? ' → Next' : ''}</span>

                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>

    const ExerciseLibraryView = ({ allExercises, workouts, unit, onSelectExercise, onAddExerciseToWorkout, onOpenCreateCustom, onOpenEditCustom }) => {

        if (group !== 'All' && ex.muscleGroup !== group) return false;

                <button onClick={() => setSourceFilter('custom')} className={`px-3 py-1.5 text-xs font-semibold ${sourceFilter === 'custom' ? 'bg-white text-slate-950' : 'text-slate-400'}`}>Custom ({allExercises.filter((e) => e.isCustom).length})</button>

            </div>
          ) : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {filtered.map((ex) => {

                          {ex.isCustom ? (<><span className="font-semibold text-white">CUSTOM</span><button onClick={() => onOpenEditCustom(ex)} className="text-slate-400 hover:text-white p-1" title="Edit custom exercise"><Icons.Edit3 className="w-3.5 h-3.5" /></button></>) : <span className="text-slate-500">{ex.equipment}</span>}

                      <button onClick={() => onSelectExercise(ex)} className="text-left text-base font-bold text-white hover:text-orange-400 block">{ex.name}</button>

                      <button onClick={() => onAddExerciseToWorkout(ex)} className="px-3 py-1.5 bg-slate-800 hover:bg-orange-500 text-slate-200 hover:text-white text-xs font-bold flex items-center gap-1"><Icons.Plus className="w-3.5 h-3.5" /> Add</button>
                    </div>
                  </div>
                );
              })}

    const ProgressView = ({ allExercises, workouts, unit, onStartWorkout }) => {
      const trainedExercises = useMemo(() => {
        const ids = new Set();
        workouts.forEach((w) => (w.exercises || []).forEach((e) => ids.add(e.exerciseId)));

      }, [allExercises, workouts]);
      const [selectedId, setSelectedId] = useState(() => trainedExercises[0]?.id || allExercises[0]?.id || '');

      useEffect(() => {
        if (trainedExercises.length > 0 && !trainedExercises.some((e) => e.id === selectedId)) setSelectedId(trainedExercises[0].id);
      }, [trainedExercises, selectedId]);

      const activeEx = allExercises.find((e) => e.id === selectedId) || allExercises[0];
      const stats = activeEx ? getExerciseAnalytics(activeEx.id, workouts) : null;
      const nextTarget = activeEx ? getNextTargetSuggestion(activeEx.id, workouts, unit) : null;

                  </button>

                <div className="bg-slate-900 border border-slate-800 p-5 space-y-4">

                    <div className="bg-slate-950 p-3"><div className="text-[11px] font-mono text-slate-400 uppercase">Best Reps</div><div className="text-lg font-extrabold text-white mt-0.5 font-mono">{stats.bestReps}</div></div>
                    <div className="bg-slate-950 p-3"><div className="text-[11px] font-mono text-slate-400 uppercase">Est. 1RM</div><div className="text-lg font-extrabold text-orange-400 mt-0.5 font-mono">{stats.best1RM} {unit}</div></div>

                  </div>
                  <ProgressionChart points={stats.points} unit={unit} />
                </div>
              </div>
            )}
          </div>
        </div>
      );

    const BodyView = ({ bodyWeights, profile, unit, onAddWeight, onDeleteWeight, onSetHeight, onUpdateProfile, onNavigateMeasurements }) => {
