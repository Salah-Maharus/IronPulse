      const [weightVal, setWeightVal] = useState('');
      const [formError, setFormError] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const heightCm = profile?.heightCm ? profile.heightCm : null;
      const age = profile?.age && profile.age > 0 ? profile.age : null;
      const sex = profile?.sex === 'female' ? 'female' : 'male';
      const imperial = unit === 'lbs';
      const [cmInput, setCmInput] = useState('');
      const [ftInput, setFtInput] = useState('');
      const [inInput, setInInput] = useState('');
      const [ageInput, setAgeInput] = useState(age ? String(age) : '');
      const [heightError, setHeightError] = useState('');

      useEffect(() => { setAgeInput(age ? String(age) : ''); }, [age]);
      useEffect(() => {
        if (!heightCm) { setCmInput(''); setFtInput(''); setInInput(''); return; }
        setCmInput(String(round1(heightCm)));
        const totalIn = heightCm / 2.54;
        let ft = Math.floor(totalIn / 12), inch = round1(totalIn - ft * 12);
        if (inch >= 12) { ft += 1; inch = 0; }
        setFtInput(String(ft)); setInInput(String(inch));
      }, [heightCm]);

      const entries = useMemo(() => getBodyEntries(bodyWeights, unit), [bodyWeights, unit]);
      const latest = entries.length ? entries[entries.length - 1] : null;
      const lowest = entries.length ? Math.min(...entries.map((e) => e.value)) : null;
      const highest = entries.length ? Math.max(...entries.map((e) => e.value)) : null;
      const change = useMemo(() => {
        if (entries.length < 2 || !latest) return null;
        const cutoff = daysAgoISO(30);
        const onOrBefore = entries.filter((e) => e.date <= cutoff);
        const baseline = onOrBefore.length ? onOrBefore[onOrBefore.length - 1] : entries[0];
        if (baseline.id === latest.id) return null;
        return { delta: round1(latest.value - baseline.value), since: baseline.date };
      }, [entries, latest]);

      const bmi = latest && heightCm ? calcBMI(latest.kg, heightCm) : null;
      const category = getBMICategory(bmi);
      const bmr = latest && heightCm && age ? calcBMR({ sex, weightKg: latest.kg, heightCm, age }) : null;
      const tdee = bmr ? Math.round(bmr * 1.55) : null;
      const ageAdjustedBF = bmi !== null && age ? calcDeurenbergBodyFat({ bmi, age, sex }) : null;
      const maxHR = calcMaxHeartRate(age);

      const segments = [{ label: 'Under', w: 14 }, { label: 'Normal', w: 26 }, { label: 'Over', w: 20 }, { label: 'Obese', w: 40 }];
      const markerPct = bmi === null ? 0 : Math.max(0, Math.min(100, ((bmi - 15) / 25) * 100));
      const healthyLow = heightCm ? round1((18.5 * Math.pow(heightCm / 100, 2)) / (unit === 'lbs' ? 0.45359237 : 1)) : null;
      const healthyHigh = heightCm ? round1((24.9 * Math.pow(heightCm / 100, 2)) / (unit === 'lbs' ? 0.45359237 : 1)) : null;

      const handleLog = (e) => {
        e.preventDefault();
        const w = parseFloat(weightVal);
        if (!dateVal) { setFormError('Pick a date.'); return; }
        const min = unit === 'lbs' ? 66 : 30, max = unit === 'lbs' ? 1000 : 450;
        if (isNaN(w) || w < min || w > max) { setFormError(`Enter a weight between ${min} and ${max} ${unit}.`); return; }
        setFormError('');
        onAddWeight(dateVal, round1(w));
        setWeightVal('');
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        let cm = heightCm;
        const hasHeightTyped = imperial ? (ftInput.trim() !== '' || inInput.trim() !== '') : cmInput.trim() !== '';
        if (hasHeightTyped) {
          cm = imperial ? (parseFloat(ftInput) || 0) * 30.48 + (parseFloat(inInput) || 0) * 2.54 : parseFloat(cmInput);
          if (isNaN(cm) || cm < 90 || cm > 250) { setHeightError(imperial ? 'Enter a height between 3 ft and 8 ft.' : 'Enter a height between 90 and 250 cm.'); return; }
          cm = round1(cm);
        }
        let nextAge = age;
        if (ageInput.trim() !== '') {
          const parsedAge = parseInt(ageInput, 10);
          if (isNaN(parsedAge) || parsedAge < 12 || parsedAge > 110) { setHeightError('Enter an age between 12 and 110 years.'); return; }
          nextAge = parsedAge;
        } else {
          nextAge = null;
        }
        setHeightError('');
        if (onUpdateProfile) onUpdateProfile({ heightCm: cm ?? null, age: nextAge, sex });
        else if (cm) onSetHeight(cm);
      };

      const rows = [...entries].reverse();

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div><h1 className="text-4xl font-extrabold text-white">Bodyweight</h1><p className="text-sm text-slate-400">Log weigh-ins, track BMI, and compute age &amp; sex-adjusted BMR, TDEE, Body Fat %, and Max HR.</p></div>
            {onNavigateMeasurements && (
              <button type="button" onClick={onNavigateMeasurements} className="px-4 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-orange-400 hover:text-white self-start whitespace-nowrap">Tape Measurements & Navy Body Fat % →</button>
            )}
          </div>
          <div className="grid lg:grid-cols-12 gap-5">
            <div className="lg:col-span-7 space-y-5">
              <form onSubmit={handleLog} className="bg-slate-900 border border-slate-800 p-4 sm:p-5">
                <div className="text-[11px] font-mono uppercase tracking-widest text-slate-400 mb-3">Log weigh-in</div>
                <div className="grid grid-cols-2 sm:grid-cols-12 gap-3 items-end">
                  <div className="col-span-1 sm:col-span-4"><label className="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">Date</label><input type="date" value={dateVal} max={todayISO()} onChange={(e) => setDateVal(e.target.value)} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm text-white font-mono" /></div>
                  <div className="col-span-1 sm:col-span-4"><label className="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">Weight ({unit})</label><input type="number" step="0.1" min="0" inputMode="decimal" value={weightVal} onChange={(e) => setWeightVal(e.target.value)} placeholder={unit === 'lbs' ? '175.0' : '80.0'} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-bold text-white font-mono" /></div>
                  <div className="col-span-2 sm:col-span-4"><button type="submit" className="w-full py-2.5 bg-white hover:bg-slate-300 text-slate-950 text-sm font-extrabold flex items-center justify-center gap-1.5"><Icons.Plus className="w-4 h-4" /> Log weight</button></div>
                </div>
                {formError && <div className="mt-3 text-xs font-mono text-orange-500">{formError}</div>}
                <p className="mt-3 text-xs text-slate-400">One entry per day. Logging the same date again replaces that entry.</p>
              </form>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-px bg-slate-800 border border-slate-800">
                <div className="bg-slate-900 p-4"><div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">Current</div><div className="text-2xl font-bold text-white font-mono mt-1">{latest ? latest.value : '—'}</div><div className="text-xs text-slate-400 mt-0.5 font-mono">{latest ? `${unit} · ${formatShortDate(latest.date)}` : unit}</div></div>
                <div className="bg-slate-900 p-4"><div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">30-day change</div><div className={`text-2xl font-bold font-mono mt-1 ${change && change.delta !== 0 ? 'text-orange-500' : 'text-white'}`}>{change ? `${change.delta > 0 ? '+' : ''}${change.delta}` : '—'}</div><div className="text-xs text-slate-400 mt-0.5 font-mono">{change ? `${unit} since ${formatShortDate(change.since)}` : 'Needs 2 entries'}</div></div>
                <div className="bg-slate-900 p-4"><div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">Lowest</div><div className="text-2xl font-bold text-white font-mono mt-1">{lowest !== null ? lowest : '—'}</div><div className="text-xs text-slate-400 mt-0.5 font-mono">{unit}</div></div>
                <div className="bg-slate-900 p-4"><div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">Highest</div><div className="text-2xl font-bold text-white font-mono mt-1">{highest !== null ? highest : '—'}</div><div className="text-xs text-slate-400 mt-0.5 font-mono">{unit}</div></div>
              </div>
              <BodyTrendChart entries={entries} unit={unit} />
            </div>
            <div className="lg:col-span-5 space-y-5">
              <div className="bg-slate-900 border border-slate-800 p-5">
                <div className="flex items-center justify-between">
                  <div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">Body Mass Index</div>
                  {category && <span className={`px-2 py-0.5 text-[11px] font-mono font-bold uppercase tracking-wider border ${category.index === 1 ? 'border-white text-white' : 'border-orange-500 text-orange-400'}`}>{category.label}</span>}
                </div>
                {bmi !== null && latest && heightCm ? (
                  <>
                    <div className="mt-3 flex items-end gap-3"><div className="text-6xl font-bold text-white font-mono leading-none">{bmi}</div><div className="pb-1 text-xs text-slate-400 font-mono">kg/m² · {latest.value} {unit} at {round1(heightCm)} cm</div></div>
                    <div className="mt-5">
                      <div className="relative">
                        <div className="flex gap-px">{segments.map((s, i) => <div key={s.label} style={{ width: `${s.w}%` }} className={`h-2 ${i === category?.index ? (i === 1 ? 'bg-white' : 'bg-orange-500') : 'bg-slate-700'}`} />)}</div>
                        <div className="absolute -top-1 w-0.5 h-4 bg-white" style={{ left: `${markerPct}%` }} />
                      </div>
                      <div className="flex gap-px mt-1.5 text-[10px] font-mono uppercase tracking-wider text-slate-400">{segments.map((s) => <div key={s.label} style={{ width: `${s.w}%` }} className="truncate">{s.label}</div>)}</div>
                      <div className="flex justify-between text-[10px] font-mono text-slate-400 mt-1"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div>
                    </div>
                    <div className="mt-4 pt-3 border-t border-slate-800 text-xs text-slate-300"><span className="text-slate-400">Normal range at your height: </span><span className="font-mono font-bold text-white">{healthyLow}–{healthyHigh} {unit}</span></div>
                  </>
                ) : (
                  <div className="mt-4 py-6 border border-dashed border-slate-700 text-center px-4">
                    <div className="text-sm font-semibold text-slate-200">{!heightCm ? 'Add your height to calculate BMI' : 'Log a weight to calculate BMI'}</div>
                    <p className="text-xs text-slate-400 mt-1">BMI uses your latest logged weight and the height saved in your profile.</p>
                  </div>
                )}
                <p className="mt-4 text-[11px] text-slate-400 leading-relaxed">BMI is a screening number. It does not separate muscle from fat, so a lifter can read high at a healthy body fat.</p>
              </div>

              <div className="bg-slate-900 border border-slate-800 p-5 space-y-4">
                <div className="flex items-center justify-between gap-2">
                  <div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">Age &amp; Sex Calculations ({sex.toUpperCase()}{age ? ` · ${age} YRS` : ''})</div>
                  {maxHR && <span className="px-2 py-0.5 border border-orange-500/60 text-[10px] font-mono font-bold text-orange-400">MAX HR {maxHR} BPM</span>}
                </div>
                {bmr !== null && tdee !== null ? (
                  <div className="space-y-3">
                    <div className="grid grid-cols-2 gap-px bg-slate-800 border border-slate-800">
                      <div className="bg-slate-950 p-3"><div className="text-[10px] font-mono uppercase text-slate-400">Resting BMR</div><div className="text-xl font-extrabold text-white font-mono tabular-nums mt-0.5">{bmr.toLocaleString()} <span className="text-xs font-normal text-slate-400">kcal</span></div></div>
                      <div className="bg-slate-950 p-3"><div className="text-[10px] font-mono uppercase text-slate-400">Training TDEE (1.55×)</div><div className="text-xl font-extrabold text-orange-400 font-mono tabular-nums mt-0.5">{tdee.toLocaleString()} <span className="text-xs font-normal text-slate-400">kcal</span></div></div>
                      <div className="bg-slate-950 p-3"><div className="text-[10px] font-mono uppercase text-slate-400">Age-Adj. Body Fat</div><div className="text-xl font-extrabold text-white font-mono tabular-nums mt-0.5">{ageAdjustedBF !== null ? `${ageAdjustedBF}%` : '—'}</div></div>
                      <div className="bg-slate-950 p-3"><div className="text-[10px] font-mono uppercase text-slate-400">Zone 2 Heart Rate</div><div className="text-base font-extrabold text-white font-mono tabular-nums mt-1">{maxHR ? `${Math.round(maxHR * 0.6)}–${Math.round(maxHR * 0.7)} bpm` : '—'}</div></div>
                    </div>
                    <div className="text-[11px] font-mono text-slate-400 flex flex-wrap justify-between gap-2 pt-1">
                      <span>Cut (−400): <strong className="text-white">{Math.max(1200, tdee - 400)} kcal</strong></span>
                      <span>Lean Bulk (+300): <strong className="text-white">{tdee + 300} kcal</strong></span>
                    </div>
                  </div>
                ) : (
                  <div className="py-5 border border-dashed border-slate-700 text-center px-4">
                    <div className="text-sm font-semibold text-slate-200">Add Age, Height &amp; Weight</div>
                    <p className="text-xs text-slate-400 mt-1">Save your age and biological sex below to calculate Mifflin-St Jeor BMR, TDEE, age-adjusted Body Fat %, and Max Heart Rate.</p>
                  </div>
                )}
              </div>

              <form onSubmit={handleSaveProfile} className="bg-slate-900 border border-slate-800 p-5 space-y-4">
                <div className="flex items-center justify-between gap-2">
                  <div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">Athlete Profile (Height · Age · Sex)</div>
                  <div className="flex border border-slate-700 bg-slate-950">
                    {['male', 'female'].map((s) => (
                      <button key={s} type="button" onClick={() => onUpdateProfile && onUpdateProfile({ sex: s })} className={`px-2.5 py-1 text-[11px] font-mono font-bold uppercase ${sex === s ? 'bg-white text-slate-950' : 'text-slate-400 hover:text-white'}`}>{s}</button>
                    ))}
                  </div>
                </div>
                <div className="flex flex-wrap items-end gap-3">
                  {imperial ? (
                    <>
                      <div className="flex-1 min-w-[70px]"><label className="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">Feet</label><input type="number" min="0" step="1" value={ftInput} onChange={(e) => setFtInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-bold font-mono text-white" /></div>
                      <div className="flex-1 min-w-[70px]"><label className="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">Inches</label><input type="number" min="0" step="0.5" value={inInput} onChange={(e) => setInInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-bold font-mono text-white" /></div>
                    </>
                  ) : (
                    <div className="flex-1 min-w-[110px]"><label className="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">Height (cm)</label><input type="number" min="0" step="0.5" value={cmInput} onChange={(e) => setCmInput(e.target.value)} placeholder="178" className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-bold font-mono text-white" /></div>
                  )}
                  <div className="w-24"><label className="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">Age (yrs)</label><input type="number" min="12" max="110" step="1" value={ageInput} onChange={(e) => setAgeInput(e.target.value)} placeholder="28" className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-bold font-mono text-white" /></div>
                  <button type="submit" className="px-4 py-2.5 border border-slate-700 hover:border-white text-white text-xs font-bold">Save</button>
                </div>
                {heightError && <div className="text-xs font-mono text-orange-500">{heightError}</div>}
                <p className="text-xs text-slate-400">{heightCm ? `Height: ${round1(heightCm)} cm` : 'Height not saved'} · {age ? `Age: ${age} yrs` : 'Age not saved'} · {sex.toUpperCase()}</p>
              </form>
            </div>
          </div>
          <div className="bg-slate-900 border border-slate-800">
            <div className="px-4 sm:px-5 py-3 border-b border-slate-800 flex items-center justify-between"><h2 className="text-lg font-bold text-white">Weigh-in history</h2><span className="text-xs font-mono text-slate-400">{entries.length} entr{entries.length === 1 ? 'y' : 'ies'}</span></div>
            {rows.length === 0 ? (
              <div className="p-8 text-center"><p className="text-sm font-semibold text-slate-300">No weigh-ins yet</p><p className="text-xs text-slate-400 mt-1">Log your first weight above to start the trend line.</p></div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr className="text-[11px] font-mono uppercase tracking-widest text-slate-400 text-left"><th className="px-4 sm:px-5 py-2 font-semibold">Date</th><th className="px-3 py-2 font-semibold text-right">Weight ({unit})</th><th className="px-3 py-2 font-semibold text-right">Change</th><th className="px-4 sm:px-5 py-2 font-semibold text-right"></th></tr></thead>
                  <tbody>
                    {rows.map((r, idx) => {
                      const prev = rows[idx + 1];
                      const d = prev ? round1(r.value - prev.value) : null;
                      return (
                        <tr key={r.id} className="border-t border-slate-800">
                          <td className="px-4 sm:px-5 py-2.5 font-mono text-slate-200 whitespace-nowrap">{formatDateLabel(r.date)}</td>
                          <td className="px-3 py-2.5 font-mono font-bold text-white text-right">{r.value}</td>
                          <td className={`px-3 py-2.5 font-mono text-right ${d === null || d === 0 ? 'text-slate-400' : 'text-orange-500'}`}>{d === null ? '—' : `${d > 0 ? '+' : ''}${d}`}</td>
                          <td className="px-4 sm:px-5 py-2.5 text-right whitespace-nowrap">
                            {confirmDeleteId === r.id ? (
                              <span className="inline-flex gap-1">
                                <button onClick={() => { onDeleteWeight(r.id); setConfirmDeleteId(null); }} className="px-2.5 py-1 bg-orange-500 text-white text-xs font-bold">Confirm</button>
                                <button onClick={() => setConfirmDeleteId(null)} className="px-2 py-1 border border-slate-700 text-slate-300 text-xs">Cancel</button>
                              </span>
                            ) : (
                              <button onClick={() => setConfirmDeleteId(r.id)} className="p-1.5 text-slate-400 hover:text-orange-500" title="Delete entry"><Icons.Trash2 className="w-4 h-4" /></button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    const HistoryView = ({ workouts, unit, selectedHistoryWorkout, onSelectHistoryWorkout, onEditWorkout, onDeleteWorkout, onSaveAsRoutine, onStartWorkout }) => {
      const [search, setSearch] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const sorted = useMemo(() => {
        const q = search.trim().toLowerCase();
        return [...workouts].sort((a, b) => (a.date < b.date ? 1 : -1)).filter((w) => !q || w.name.toLowerCase().includes(q) || w.date.includes(q) || (w.exercises || []).some((e) => e.name.toLowerCase().includes(q)));
      }, [workouts, search]);

      const checkSessionPRs = (w) => {
        const older = workouts.filter((other) => other.id !== w.id && other.date < w.date);
        return w.exercises.some((ex) => ex.sets.some((s) => isSetPersonalRecord(ex.exerciseId, s, older).isPR));
      };

      return (
        <div className="space-y-5">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div><h1 className="text-4xl font-extrabold text-white">Workout History</h1><p className="text-sm text-slate-400">Review past sessions, inspect sets & volume, or edit/delete entries.</p></div>
            <div className="relative w-full sm:w-72">
              <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
              <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Filter by name, date, exercise..." className="w-full bg-slate-900 border border-slate-700 pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-orange-500" />
            </div>
          </div>

          {sorted.length === 0 ? (
            <div className="bg-slate-900 border border-slate-800 p-10 text-center">
              <Icons.History className="w-9 h-9 text-slate-600 mx-auto mb-3" />
              <p className="text-base font-bold text-slate-200">{workouts.length === 0 ? 'No Completed Workouts Yet' : 'No Matching Workouts'}</p>
              <p className="text-xs text-slate-500 mt-1 mb-5">{workouts.length === 0 ? 'Finish a workout in the logger and it will appear here by date.' : 'Try a different search filter.'}</p>
              {workouts.length === 0 && <button onClick={onStartWorkout} className="px-5 py-2.5 bg-orange-500 text-white text-xs font-bold">+ Start First Workout</button>}
            </div>
          ) : (
            <div className="space-y-3">
              {sorted.map((w) => {
                const st = computeWorkoutStats(w);
                const hadPR = checkSessionPRs(w);
                return (
                  <div key={w.id} onClick={() => onSelectHistoryWorkout(w)} className="cursor-pointer bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div className="space-y-1">
                      <div className="flex items-center gap-2.5 flex-wrap">
                        <span className="text-xs font-mono font-bold text-orange-400">{formatDateLabel(w.date)}</span>
                        <h3 className="text-base font-bold text-white">{w.name}</h3>
                        {hadPR && <span className="px-1.5 py-0.5 bg-orange-500 text-white font-mono text-[10px] font-extrabold">[ NEW PR ]</span>}
                      </div>
                      <div className="text-xs font-mono text-slate-400 flex flex-wrap gap-x-2 gap-y-1">
                        <span>{w.exercises.length} exercises</span><span>·</span><span>{st.completedSets} completed sets</span><span>·</span><span className="text-white font-semibold">{st.totalVolume.toLocaleString()} {unit} volume</span>
                      </div>
                      <div className="flex flex-wrap gap-1.5 pt-1 text-[11px] font-mono text-slate-400">
                        {w.exercises.slice(0, 4).map((ex, i) => <span key={ex.id}>{i > 0 && '· '}{ex.name}</span>)}
                        {w.exercises.length > 4 && <span>+{w.exercises.length - 4} more</span>}
                      </div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0" onClick={(e) => e.stopPropagation()}>
                      <button onClick={() => onSaveAsRoutine(w)} className="px-3 py-1.5 bg-slate-800 hover:bg-orange-500 text-slate-200 hover:text-white text-xs font-semibold flex items-center gap-1.5 transition" title="Save as reusable routine"><Icons.BookmarkPlus className="w-3.5 h-3.5" /> Save Routine</button>
                      <button onClick={() => onEditWorkout(w)} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center gap-1.5"><Icons.Edit3 className="w-3.5 h-3.5" /> Edit</button>
                      {confirmDeleteId === w.id ? (
                        <div className="flex items-center gap-1">
                          <button onClick={() => { onDeleteWorkout(w.id); setConfirmDeleteId(null); }} className="px-2.5 py-1.5 bg-orange-500 text-white text-xs font-bold">Confirm</button>
                          <button onClick={() => setConfirmDeleteId(null)} className="px-2 py-1.5 bg-slate-800 text-slate-300 text-xs">Cancel</button>
                        </div>
                      ) : (
                        <button onClick={() => setConfirmDeleteId(w.id)} className="p-2 bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-orange-400" title="Delete workout"><Icons.Trash2 className="w-4 h-4" /></button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {selectedHistoryWorkout && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div className="sticky top-0 bg-slate-900 border-b border-slate-800 px-5 py-4 flex items-start justify-between gap-4">
                  <div><div className="text-xs font-mono font-bold text-orange-400">{formatDateLabel(selectedHistoryWorkout.date)}</div><h3 className="text-xl font-extrabold text-white mt-0.5">{selectedHistoryWorkout.name}</h3></div>
                  <button onClick={() => onSelectHistoryWorkout(null)} className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300"><Icons.X className="w-5 h-5" /></button>
                </div>
                <div className="p-5 space-y-4">
                  {selectedHistoryWorkout.notes && <div className="bg-slate-950 border border-slate-800 p-3 text-xs text-slate-300"><span className="font-mono font-semibold text-slate-400">NOTES: </span>{selectedHistoryWorkout.notes}</div>}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-px bg-slate-800 border border-slate-800">
                    <div className="bg-slate-950 p-3 text-center"><div className="text-[11px] font-mono text-slate-400 uppercase">Total Volume</div><div className="text-base font-extrabold text-white font-mono">{computeWorkoutStats(selectedHistoryWorkout).totalVolume.toLocaleString()} {unit}</div></div>
                    <div className="bg-slate-950 p-3 text-center"><div className="text-[11px] font-mono text-slate-400 uppercase">Sets Completed</div><div className="text-base font-extrabold text-orange-400 font-mono">{computeWorkoutStats(selectedHistoryWorkout).completedSets}</div></div>
                    <div className="bg-slate-950 p-3 text-center"><div className="text-[11px] font-mono text-slate-400 uppercase">Exercises</div><div className="text-base font-extrabold text-white font-mono">{selectedHistoryWorkout.exercises.length}</div></div>
                    <div className="bg-slate-950 p-3 text-center"><div className="text-[11px] font-mono text-slate-400 uppercase">Duration</div><div className="text-base font-extrabold text-white font-mono">{selectedHistoryWorkout.durationSeconds ? formatElapsed(selectedHistoryWorkout.durationSeconds * 1000) : '—'}</div></div>
                  </div>
                  {(selectedHistoryWorkout.restLog?.length ?? 0) > 0 && (
                    <div className="bg-slate-950 border border-slate-800 p-3.5 space-y-2">
                      <div className="flex items-center justify-between text-[11px] font-mono uppercase tracking-wider text-slate-400">
                        <span className="flex items-center gap-1.5 text-white font-bold"><Icons.Timer className="w-3.5 h-3.5 text-orange-400" /> Rest Timer History</span>
                        <span>{selectedHistoryWorkout.restLog.length} intervals</span>
                      </div>
                      <div className="space-y-1">
                        {selectedHistoryWorkout.restLog.map((entry, idx) => (
                          <div key={entry.id} className="flex flex-wrap items-center justify-between gap-2 text-xs font-mono py-1.5 px-2 bg-slate-900 border border-slate-800/70">
                            <div className="flex items-center gap-2 min-w-0">
                              <span className="text-slate-500">#{idx + 1}</span>
                              <span className="text-slate-400">{formatTimeOfDay(entry.startedAt)}</span>
                              <span className="text-white truncate">{entry.label}</span>
                            </div>
                            <span className="text-orange-400 font-bold shrink-0">{entry.status === 'stopped' ? 'Stopped ' : 'Took '}{formatElapsed((entry.durationSeconds || 0) * 1000)} (target {entry.plannedSeconds}s)</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  <div className="space-y-3">
                    {selectedHistoryWorkout.exercises.map((ex) => {
                      const olderWorkouts = workouts.filter((other) => other.id !== selectedHistoryWorkout.id && other.date < selectedHistoryWorkout.date);
                      return (
                        <div key={ex.id} className="bg-slate-950 border border-slate-800 p-3.5">
                          <div className="flex items-center justify-between mb-2"><h4 className="text-sm font-bold text-white">{ex.name}</h4><span className="text-[11px] font-mono font-semibold text-orange-400">{ex.muscleGroup}</span></div>
                          <div className="space-y-1">
                            {ex.sets.map((s, idx) => {
                              const pr = isSetPersonalRecord(ex.exerciseId, s, olderWorkouts);
                              return (
                                <div key={s.id} className="flex items-center justify-between text-xs font-mono py-1.5 px-2 bg-slate-900 border border-slate-800/60">
                                  <span className="text-slate-400">Set {idx + 1}</span>
                                  <span className="font-bold text-white">{s.weight} {unit} × {s.reps} reps</span>
                                  <span className="flex items-center gap-2">
                                    {pr.isPR && <span className="px-1.5 py-0.5 bg-orange-500 text-white text-[10px] font-extrabold">[ NEW PR ]</span>}
                                    <span className={s.completed ? 'text-white font-semibold' : 'text-slate-500'}>{s.completed ? 'Done' : 'Skipped'}</span>
                                  </span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button onClick={() => onSaveAsRoutine(selectedHistoryWorkout)} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs font-bold flex items-center gap-1.5"><Icons.BookmarkPlus className="w-3.5 h-3.5 text-orange-400" /> Save as Routine</button>
                    <button onClick={() => { onEditWorkout(selectedHistoryWorkout); onSelectHistoryWorkout(null); }} className="px-4 py-2 bg-orange-500 hover:bg-orange-400 text-white text-xs font-bold flex items-center gap-1.5"><Icons.Edit3 className="w-3.5 h-3.5" /> Edit This Workout</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ========================================================================
    // 8B. WARMUP, ROUTINES & MEASUREMENTS VIEWS
    // ========================================================================
    const WarmupView = ({ hasActiveWorkout, onStartOrResumeWorkout }) => {
      const [checkedIds, setCheckedIds] = useState({});
      const completedCount = COMMON_WARMUPS.filter((d) => checkedIds[d.id]).length;
      const toggleCheck = (id) => setCheckedIds((prev) => ({ ...prev, [id]: !prev[id] }));

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-4xl font-extrabold text-white">Warm-Up</h1>
              <p className="text-sm text-slate-400">4 quick general movements before lifting, plus automatic light-effort ramp sets on the first exercise of each muscle group.</p>
            </div>
            <button type="button" onClick={onStartOrResumeWorkout} className="px-5 py-2.5 bg-orange-500 hover:bg-orange-400 text-white text-xs sm:text-sm font-extrabold flex items-center gap-2 self-start whitespace-nowrap">
              <Icons.Play className="w-4 h-4" />{hasActiveWorkout ? 'Return to Live Workout' : 'Start New Workout'}
            </button>
          </div>

          <div className="bg-slate-900 border border-orange-500/60 p-4 sm:p-5 space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <div className="text-[11px] font-mono uppercase tracking-widest text-orange-400 font-bold">Pre-Lift Warm-Up Checklist</div>
                <h2 className="text-xl font-extrabold text-white mt-0.5">4 Essential Movements ({completedCount}/{COMMON_WARMUPS.length})</h2>
              </div>
              {completedCount > 0 && (
                <button type="button" onClick={() => setCheckedIds({})} className="px-2.5 py-1.5 bg-slate-950 hover:bg-slate-800 border border-slate-700 text-[11px] font-mono text-slate-300">Reset Checks</button>
              )}
            </div>

            <div className="grid sm:grid-cols-2 gap-3">
              {COMMON_WARMUPS.map((drill, idx) => {
                const done = Boolean(checkedIds[drill.id]);
                return (
                  <button key={drill.id} type="button" onClick={() => toggleCheck(drill.id)} className={`w-full text-left p-4 border flex items-start justify-between gap-3 transition ${done ? 'bg-slate-950 border-white/60 opacity-80' : 'bg-slate-950 border-slate-800 hover:border-slate-600'}`}>
                    <div className="flex items-start gap-3 min-w-0">
                      <div className={`w-5 h-5 mt-0.5 border flex items-center justify-center shrink-0 ${done ? 'bg-white border-white text-slate-950' : 'bg-slate-900 border-slate-600 text-transparent'}`}><Icons.Check className="w-3.5 h-3.5" /></div>
                      <div className="min-w-0">
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="text-[11px] font-mono text-orange-400 font-bold">0{idx + 1}</span>
                          <span className="text-base font-bold text-white">{drill.name}</span>
                        </div>
                        <div className="text-[11px] font-mono text-slate-400 mt-0.5">{drill.durationOrReps} · {drill.muscles}</div>
                        <p className="text-xs text-slate-300 mt-1.5 leading-relaxed">{drill.cue}</p>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>

            <div className="bg-slate-950 border border-slate-800 p-4 space-y-1.5 text-xs font-mono">
              <div className="text-orange-400 font-bold uppercase tracking-wider">First-Exercise-Per-Muscle Warm-Up Set</div>
              <p className="text-slate-300 leading-relaxed">
                In the live workout logger, once you enter your normal working weight on the <span className="text-white font-bold">first exercise of each muscle group</span> (for example, your first Chest lift or first Biceps lift), IronPulse calculates <span className="text-white font-bold">1 light-effort warm-up set</span> (<span className="text-white">50% × 8 reps</span>) with a <span className="text-orange-400 font-bold">[ + WARMUP ]</span> button. Subsequent exercises for that same muscle skip warm-up sets to keep logging fast and simple.
              </p>
            </div>
          </div>
        </div>
      );
    };

    const RoutinesView = ({ routines, workouts, allExercises, unit, onLaunchRoutine, onSaveRoutine, onDeleteRoutine, onRestoreDefaults, onSaveWorkoutAsRoutine }) => {
      const [builderOpen, setBuilderOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [routineName, setRoutineName] = useState('');
      const [splitTag, setSplitTag] = useState('CUSTOM');
      const [routineNotes, setRoutineNotes] = useState('');
      const [items, setItems] = useState([]);
      const [exSearch, setExSearch] = useState('');
      const [exGroup, setExGroup] = useState('All');
      const [error, setError] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);

      const openNewBuilder = () => {
        setEditingId(null); setRoutineName(''); setSplitTag('CUSTOM'); setRoutineNotes(''); setItems([]); setError(''); setBuilderOpen(true);
      };
      const openEditBuilder = (r) => {
        setEditingId(r.id); setRoutineName(r.name); setSplitTag(r.splitTag || 'CUSTOM'); setRoutineNotes(r.notes || ''); setItems(r.exercises.map((e) => ({ ...e }))); setError(''); setBuilderOpen(true);
      };

      const filteredExercises = useMemo(() => {
        const q = exSearch.trim().toLowerCase();
        return allExercises.filter((ex) => {
          if (exGroup !== 'All' && ex.muscleGroup !== exGroup) return false;
          if (!q) return true;
          return ex.name.toLowerCase().includes(q) || ex.muscleGroup.toLowerCase().includes(q) || (ex.equipment || '').toLowerCase().includes(q) || (ex.family || '').toLowerCase().includes(q);
        });
      }, [allExercises, exSearch, exGroup]);

      const handleAddEx = (exId) => {
        if (items.some((i) => i.exerciseId === exId)) return;
        setItems((prev) => [...prev, { exerciseId: exId, defaultSets: 3 }]);
      };
      const handleMoveItem = (idx, dir) => {
        const nextIdx = idx + dir;
        if (nextIdx < 0 || nextIdx >= items.length) return;
        const copy = [...items];
        const [moved] = copy.splice(idx, 1);
        copy.splice(nextIdx, 0, moved);
        setItems(copy);
      };
      const handleSave = (e) => {
        e.preventDefault();
        if (!routineName.trim()) { setError('Enter a name for this routine.'); return; }
        if (items.length === 0) { setError('Add at least one exercise to the routine.'); return; }
        onSaveRoutine({ id: editingId || `rtn-${uid()}`, name: routineName.trim(), splitTag: splitTag.trim().toUpperCase() || 'CUSTOM', notes: routineNotes.trim() || undefined, exercises: items, isBuiltIn: false, createdAt: new Date().toISOString() });
        setBuilderOpen(false);
      };

      const recentCompleted = useMemo(() => [...workouts].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 6), [workouts]);
      const hasMissingDefaults = DEFAULT_ROUTINES.some((def) => !routines.some((r) => r.id === def.id));

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-4xl font-extrabold text-white">Routines & Templates</h1>
              <p className="text-sm text-slate-400">Launch Push / Pull / Legs or your own custom splits in 1 click with your last logged weights as ghost targets.</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              {hasMissingDefaults && (
                <button type="button" onClick={onRestoreDefaults} className="px-3.5 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 text-xs font-bold flex items-center gap-1.5 whitespace-nowrap"><Icons.RotateCcw className="w-3.5 h-3.5 text-orange-400" /> Restore Push/Pull/Legs</button>
              )}
              <button type="button" onClick={() => (builderOpen ? setBuilderOpen(false) : openNewBuilder())} className="px-4 py-2.5 bg-orange-500 hover:bg-orange-400 text-white text-xs sm:text-sm font-extrabold flex items-center gap-2 whitespace-nowrap">
                {builderOpen ? <Icons.X className="w-4 h-4" /> : <Icons.Plus className="w-4 h-4" />}{builderOpen ? 'Close Builder' : 'Create Custom Routine'}
              </button>
            </div>
          </div>

          {builderOpen && (
            <form onSubmit={handleSave} className="bg-slate-900 border border-orange-500/70 p-4 sm:p-5 space-y-4">
              <div className="flex items-center justify-between">
                <div className="text-[11px] font-mono uppercase tracking-widest text-orange-400 font-bold">{editingId ? 'Edit Reusable Routine' : 'Create Your Own Reusable Routine'}</div>
                <button type="button" onClick={() => setBuilderOpen(false)} className="text-xs font-mono text-slate-400 hover:text-white">Cancel</button>
              </div>
              <div className="grid sm:grid-cols-12 gap-3">
                <div className="sm:col-span-6">
                  <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">Routine Name *</label>
                  <input type="text" value={routineName} onChange={(e) => setRoutineName(e.target.value)} placeholder="e.g. Upper Power, Arnold Split A, Full Body" className="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-sm font-bold text-white focus:outline-none focus:border-orange-500" />
                </div>
                <div className="sm:col-span-3">
                  <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">Split Tag</label>
                  <select value={splitTag} onChange={(e) => setSplitTag(e.target.value)} className="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-orange-500">
                    {['PUSH', 'PULL', 'LEGS', 'UPPER', 'LOWER', 'FULL', 'ARMS', 'CUSTOM'].map((t) => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div className="sm:col-span-3">
                  <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">Cue / Note (Optional)</label>
                  <input type="text" value={routineNotes} onChange={(e) => setRoutineNotes(e.target.value)} placeholder="Focus, rep range..." className="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500" />
                </div>
              </div>
              <div className="grid lg:grid-cols-12 gap-4">
                <div className="lg:col-span-6 bg-slate-950 border border-slate-800 p-3.5 space-y-2.5">
                  <div className="flex items-center justify-between text-[11px] font-mono uppercase text-slate-400"><span>Routine Order ({items.length} exercises)</span><span>Target Sets</span></div>
                  {items.length === 0 ? (
                    <div className="py-8 text-center text-xs font-mono text-slate-500 border border-dashed border-slate-800">Pick exercises from the catalog on the right →</div>
                  ) : (
                    <div className="space-y-1.5 max-h-72 overflow-y-auto">
                      {items.map((item, idx) => {
                        const meta = allExercises.find((e) => e.id === item.exerciseId);
                        return (
                          <div key={item.exerciseId} className="p-2.5 bg-slate-900 border border-slate-800 flex items-center justify-between gap-2">
                            <div className="min-w-0">
                              <div className="text-xs font-bold text-white truncate">{idx + 1}. {meta?.name || item.exerciseId}</div>
                              <div className="text-[10px] font-mono text-slate-400">{meta?.muscleGroup} · {meta?.equipment}</div>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                              <input type="number" min="1" max="10" value={item.defaultSets} onChange={(e) => { const val = Math.max(1, Math.min(10, Number(e.target.value) || 3)); setItems((prev) => prev.map((it, i) => (i === idx ? { ...it, defaultSets: val } : it))); }} className="w-12 bg-slate-950 border border-slate-700 py-1 text-xs font-mono font-bold text-white text-center" />
                              <button type="button" onClick={() => handleMoveItem(idx, -1)} disabled={idx === 0} className="p-1 bg-slate-950 border border-slate-800 text-slate-400 hover:text-white disabled:opacity-30"><Icons.ArrowUp className="w-3 h-3" /></button>
                              <button type="button" onClick={() => handleMoveItem(idx, 1)} disabled={idx === items.length - 1} className="p-1 bg-slate-950 border border-slate-800 text-slate-400 hover:text-white disabled:opacity-30"><Icons.ArrowDown className="w-3 h-3" /></button>
                              <button type="button" onClick={() => setItems((prev) => prev.filter((_, i) => i !== idx))} className="p-1 text-slate-500 hover:text-orange-400"><Icons.X className="w-3.5 h-3.5" /></button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
                <div className="lg:col-span-6 bg-slate-950 border border-slate-800 p-3.5 space-y-2.5">
                  <div className="relative">
                    <Icons.Search className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                    <input type="text" value={exSearch} onChange={(e) => setExSearch(e.target.value)} placeholder="Search exercises to add..." className="w-full bg-slate-900 border border-slate-700 pl-9 pr-3 py-2 text-xs text-white focus:outline-none focus:border-orange-500" />
                  </div>
                  <div className="flex gap-1 overflow-x-auto pb-1">
                    {MUSCLE_GROUPS.map((g) => (
                      <button key={g} type="button" onClick={() => setExGroup(g)} className={`px-2.5 py-1 text-[11px] font-semibold whitespace-nowrap ${exGroup === g ? 'bg-orange-500 text-white' : 'bg-slate-900 border border-slate-800 text-slate-300'}`}>{g}</button>
                    ))}
                  </div>
                  <div className="space-y-1 max-h-56 overflow-y-auto">
                    {filteredExercises.map((ex) => {
                      const alreadyAdded = items.some((i) => i.exerciseId === ex.id);
                      return (
                        <button key={ex.id} type="button" disabled={alreadyAdded} onClick={() => handleAddEx(ex.id)} className={`w-full text-left px-3 py-2 border flex items-center justify-between gap-2 text-xs transition ${alreadyAdded ? 'bg-slate-900/50 border-slate-800 text-slate-500 cursor-default' : 'bg-slate-900 border-slate-800 hover:border-orange-500 text-white'}`}>
                          <span className="truncate font-semibold">{ex.name}</span>
                          <span className="font-mono text-[11px] text-orange-400 shrink-0">{alreadyAdded ? 'ADDED' : '+ ADD'}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
              {error && <div className="text-xs font-mono text-orange-400">! {error}</div>}
              <div className="flex justify-end gap-2">
                <button type="button" onClick={() => setBuilderOpen(false)} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold">Cancel</button>
                <button type="submit" className="px-5 py-2 bg-white hover:bg-slate-300 text-slate-950 text-xs font-extrabold flex items-center gap-1.5"><Icons.Check className="w-4 h-4" /> Save Routine</button>
              </div>
            </form>
          )}

          {routines.length === 0 ? (
            <div className="bg-slate-900 border border-slate-800 p-10 text-center space-y-3">
              <Icons.Layers className="w-8 h-8 text-slate-600 mx-auto" />
              <p className="text-sm font-bold text-white">No Saved Routines Yet</p>
              <p className="text-xs text-slate-400">Create your own custom routine or restore the default Push / Pull / Legs templates.</p>
              <div className="flex justify-center gap-2 pt-2">
                <button type="button" onClick={onRestoreDefaults} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold">Load Push / Pull / Legs</button>
                <button type="button" onClick={openNewBuilder} className="px-4 py-2 bg-orange-500 text-white text-xs font-bold">+ Create Custom Routine</button>
              </div>
            </div>
          ) : (
            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
              {routines.map((rtn) => (
                <div key={rtn.id} className="bg-slate-900 border border-slate-800 p-4 sm:p-5 flex flex-col justify-between gap-4">
                  <div className="space-y-3">
                    <div className="flex items-start justify-between gap-2">
                      <div>
                        <div className="flex items-center gap-2 text-[11px] font-mono">
                          <span className="text-orange-400 font-bold uppercase">{rtn.splitTag}</span>
                          <span className="text-slate-600">·</span>
                          <span className="text-slate-400">{rtn.exercises.length} exercises</span>
                        </div>
                        <h2 className="text-xl font-extrabold text-white mt-0.5">{rtn.name}</h2>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">

                          <button type="button" onClick={() => setConfirmDeleteId(rtn.id)} className="p-1.5 bg-slate-950 hover:bg-rose-950 border border-slate-800 text-slate-400 hover:text-orange-400" title="Delete routine"><Icons.Trash2 className="w-3.5 h-3.5" /></button>
                        )}

                    <div className="bg-slate-950 border border-slate-800 divide-y divide-slate-800/80">
                      {rtn.exercises.map((item) => {
                        const meta = allExercises.find((e) => e.id === item.exerciseId);

                          <div key={item.exerciseId} className="px-3 py-2 flex items-center justify-between gap-2 text-xs">

                            </div>
                            <span className="font-mono text-[11px] text-slate-400 shrink-0 tabular-nums">{analytics.bestSet ? `Last ${analytics.bestSet.weight}${unit}×${analytics.bestSet.reps}` : 'Fresh'}</span>
                          </div>

                      })}
                    </div>
                  </div>
                  <button type="button" onClick={() => onLaunchRoutine(rtn)} className="w-full py-3 bg-white hover:bg-slate-300 text-slate-950 text-sm font-extrabold flex items-center justify-center gap-2 transition"><Icons.Play className="w-4 h-4" /> Start Routine</button>
                </div>
              ))}
            </div>
          )}

          {recentCompleted.length > 0 && (
            <div className="bg-slate-900 border border-slate-800 p-4 sm:p-5 space-y-3">
              <div>
                <div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">Save From Completed History</div>
                <h2 className="text-lg font-bold text-white mt-0.5">Turn Any Past Workout Into a Reusable Routine</h2>
              </div>
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                {recentCompleted.map((w) => (
                  <div key={w.id} className="p-3 bg-slate-950 border border-slate-800 flex items-center justify-between gap-2">
                    <div className="min-w-0">
                      <div className="text-xs font-bold text-white truncate">{w.name}</div>
                      <div className="text-[11px] font-mono text-slate-400">{formatShortDate(w.date)} · {w.exercises.length} exercises</div>
                    </div>
                    <button type="button" onClick={() => onSaveWorkoutAsRoutine(w)} className="px-2.5 py-1.5 bg-slate-800 hover:bg-orange-500 text-white text-[11px] font-bold flex items-center gap-1 shrink-0 whitespace-nowrap transition"><Icons.BookmarkPlus className="w-3.5 h-3.5" /> Save</button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

const MeasurementsView = ({ measurements, bodyWeights, profile, weightUnit, onAddMeasurement, onDeleteMeasurement, onUpdateProfile }) => {
      const mUnit = profile?.measurementUnit === 'in' ? 'in' : 'cm';
      const sex = profile?.sex === 'female' ? 'female' : 'male';
      const heightCm = profile?.heightCm || null;
      const [dateVal, setDateVal] = useState(todayISO());
      const [waistInput, setWaistInput] = useState('');
      const [neckInput, setNeckInput] = useState('');
      const [shouldersInput, setShouldersInput] = useState('');
      const [chestInput, setChestInput] = useState('');
      const [armsInput, setArmsInput] = useState('');
      const [thighInput, setThighInput] = useState('');
      const [hipsInput, setHipsInput] = useState('');
      const [weightInput, setWeightInput] = useState('');
      const [formError, setFormError] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [heightInputCm, setHeightInputCm] = useState(heightCm ? String(round1(heightCm)) : '');

      useEffect(() => { setHeightInputCm(heightCm ? String(round1(heightCm)) : ''); }, [heightCm]);

      const sorted = useMemo(() => [...(measurements || [])].sort((a, b) => (a.date < b.date ? 1 : -1)), [measurements]);
      const latest = sorted[0] || null;
      const previous = sorted[1] || null;
      const weightEntries = useMemo(() => getBodyEntries(bodyWeights, weightUnit), [bodyWeights, weightUnit]);
      const latestWeight = weightEntries.length ? weightEntries[weightEntries.length - 1] : null;

      // Preload all fields from the latest recorded entry
      const handlePreloadLast = () => {
        if (!latest) return;
        setWaistInput(latest.waistCm ? String(round1(fromCm(latest.waistCm, mUnit))) : '');
        setNeckInput(latest.neckCm ? String(round1(fromCm(latest.neckCm, mUnit))) : '');
        setShouldersInput(latest.shouldersCm ? String(round1(fromCm(latest.shouldersCm, mUnit))) : '');
        setChestInput(latest.chestCm ? String(round1(fromCm(latest.chestCm, mUnit))) : '');
        setArmsInput(latest.armsCm ? String(round1(fromCm(latest.armsCm, mUnit))) : '');
        setThighInput(latest.thighCm ? String(round1(fromCm(latest.thighCm, mUnit))) : '');
        setHipsInput(latest.hipsCm ? String(round1(fromCm(latest.hipsCm, mUnit))) : '');
        if (latestWeight) setWeightInput(String(latestWeight.value));
      };

      const navyBF = latest ? calcNavyBodyFat({ sex, heightCm, waistCm: latest.waistCm, neckCm: latest.neckCm, hipsCm: latest.hipsCm }) : null;
      const bfCat = getBodyFatCategory(navyBF, sex);
      const whtr = latest ? calcWaistToHeightRatio(latest.waistCm, heightCm) : null;
      const whtrCat = getWHtRCategory(whtr);

      // Live V-Taper ratio checked directly from shoulder & waist inputs (with fallback to latest saved)
      const inputWaist = parseFloat(waistInput);
      const inputShoulders = parseFloat(shouldersInput);
      const activeShoulderWaistRatio = (inputShoulders > 0 && inputWaist > 0)
        ? round2(inputShoulders / inputWaist)
        : (latest ? calcShoulderToWaistRatio(latest.shouldersCm, latest.waistCm) : null);

      const getVTaperLabel = (ratio) => {
        if (!ratio) return null;
        if (ratio >= 1.61) return { label: 'Golden Ratio / Ideal V-Taper (1.61:1)', color: 'text-orange-400' };
        if (ratio >= 1.50) return { label: 'Strong Athletic V-Taper', color: 'text-white' };
        if (ratio >= 1.40) return { label: 'Moderate V-Taper', color: 'text-slate-300' };
        return { label: 'Building V-Taper (Focus on Delts & Lats)', color: 'text-slate-400' };
      };
      const vTaperStatus = getVTaperLabel(activeShoulderWaistRatio);

      const fatMass = navyBF !== null && latestWeight ? round1(latestWeight.value * (navyBF / 100)) : null;
      const leanMass = fatMass !== null && latestWeight ? round1(latestWeight.value - fatMass) : null;
      const disp = (cmVal) => (!cmVal || cmVal <= 0 ? '—' : String(round1(fromCm(cmVal, mUnit))));
      const deltaDisp = (curCm, prevCm) => (!curCm || !prevCm ? null : round1(fromCm(curCm - prevCm, mUnit)));

      const handleSave = (e) => {
        e.preventDefault();
        const wVal = parseFloat(waistInput);
        if (!dateVal) { setFormError('Pick a measurement date.'); return; }
        if (isNaN(wVal) || wVal <= 0) { setFormError(`Enter a valid waist circumference in ${mUnit}.`); return; }
        const optParse = (s) => { const v = parseFloat(s); return !isNaN(v) && v > 0 ? round1(toCm(v, mUnit)) : undefined; };
        const optWeight = parseFloat(weightInput);
        const validWeight = !isNaN(optWeight) && optWeight > 0 ? round1(optWeight) : undefined;
        setFormError('');
        onAddMeasurement({
          id: `meas-${uid()}`,
          date: dateVal,
          unit: mUnit,
          waistCm: round1(toCm(wVal, mUnit)),
          neckCm: optParse(neckInput),
          shouldersCm: optParse(shouldersInput),
          chestCm: optParse(chestInput),
          armsCm: optParse(armsInput),
          thighCm: optParse(thighInput),
          hipsCm: optParse(hipsInput),
          updatedAt: new Date().toISOString()
        }, validWeight);
        setWaistInput(''); setNeckInput(''); setShouldersInput(''); setChestInput(''); setArmsInput(''); setThighInput(''); setHipsInput(''); setWeightInput('');
      };

      const handleSaveHeightQuick = (e) => {
        e.preventDefault();
        const h = parseFloat(heightInputCm);
        if (isNaN(h) || h < 90 || h > 250) return;
        onUpdateProfile({ heightCm: round1(h) });
      };
      const whtrPct = whtr === null ? 0 : Math.max(0, Math.min(100, ((whtr - 0.35) / 0.35) * 100));

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

            </div>
            <div className="flex flex-wrap items-center gap-2">
              <div className="flex border border-slate-700 bg-slate-900">
                {['cm', 'in'].map((u) => (
                  <button key={u} type="button" onClick={() => onUpdateProfile({ measurementUnit: u })} className={`px-3 py-1.5 text-xs font-mono font-bold uppercase ${mUnit === u ? 'bg-orange-500 text-white' : 'text-slate-400 hover:text-white'}`}>{u}</button>
                ))}
              </div>
              <div className="flex border border-slate-700 bg-slate-900">
                {['male', 'female'].map((s) => (
                  <button key={s} type="button" onClick={() => onUpdateProfile({ sex: s })} className={`px-3 py-1.5 text-xs font-mono font-bold uppercase ${sex === s ? 'bg-white text-slate-950' : 'text-slate-400 hover:text-white'}`}>{s}</button>
                ))}
              </div>
            </div>
          </div>

          <div className="grid lg:grid-cols-12 gap-5">
            <div className="lg:col-span-6 bg-slate-900 border border-slate-800 p-5 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between gap-2">
                  <div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">US Navy Body Fat Estimator ({sex.toUpperCase()})</div>
                  {bfCat && <span className="px-2 py-0.5 text-[11px] font-mono font-bold uppercase border border-orange-500 text-orange-400">{bfCat.label}</span>}
                </div>
                {navyBF !== null ? (
                  <div className="mt-4 space-y-4">
                    <div className="flex items-end gap-3">
                      <div className="text-6xl font-extrabold text-white font-mono tabular-nums leading-none">{navyBF}%</div>
                      <div className="pb-1 text-xs font-mono text-slate-400">EST. BODY FAT · {formatShortDate(latest.date)}</div>
                    </div>
                    <div className="grid grid-cols-3 gap-px bg-slate-800 border border-slate-800">
                      <div className="bg-slate-950 p-3"><div className="text-[10px] font-mono uppercase text-slate-400">Lean Mass</div><div className="text-base font-bold text-white font-mono mt-0.5">{leanMass !== null ? `${leanMass} ${weightUnit}` : '—'}</div></div>
                      <div className="bg-slate-950 p-3"><div className="text-[10px] font-mono uppercase text-slate-400">Fat Mass</div><div className="text-base font-bold text-orange-400 font-mono mt-0.5">{fatMass !== null ? `${fatMass} ${weightUnit}` : '—'}</div></div>
                      <div className="bg-slate-950 p-3"><div className="text-[10px] font-mono uppercase text-slate-400">Body Weight</div><div className="text-base font-bold text-white font-mono mt-0.5">{latestWeight ? `${latestWeight.value} ${weightUnit}` : '—'}</div></div>
                    </div>
                  </div>
                ) : (
                  <div className="mt-4 py-6 border border-dashed border-slate-700 text-center px-4">
                    <div className="text-sm font-semibold text-white">Need Height + Waist + Neck{sex === 'female' ? ' + Hips' : ''}</div>
                    <p className="text-xs text-slate-400 mt-1">Save your height below and log waist & neck tape measurements to calculate Navy Body Fat %.</p>
                  </div>
                )}
              </div>
              <p className="mt-4 text-[11px] font-mono text-slate-500">Formula uses logarithmic waist-to-neck and height circumference geometry (Hodgdon & Beckett).</p>
            </div>

            <div className="lg:col-span-6 bg-slate-900 border border-slate-800 p-5 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between gap-2">
                  <div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">Waist-to-Height Ratio (WHtR) & V-Taper</div>
                  {whtrCat && <span className={`px-2 py-0.5 text-[11px] font-mono font-bold uppercase border ${whtrCat.index === 1 ? 'border-white text-white' : 'border-orange-500 text-orange-400'}`}>{whtrCat.label}</span>}
                </div>
                {whtr !== null && latest && heightCm ? (
                  <div className="mt-4 space-y-4">
                    <div className="flex items-end gap-3">
                      <div className="text-6xl font-extrabold text-white font-mono tabular-nums leading-none">{whtr}</div>
                      <div className="pb-1 text-xs font-mono text-slate-400">WAIST {disp(latest.waistCm)} {mUnit} / HEIGHT {round1(heightCm)} cm</div>
                    </div>
                    <div>
                      <div className="relative">
                        <div className="flex gap-px">
                          {[{ label: 'Lean', w: 23 }, { label: 'Athletic', w: 20 }, { label: 'Elevated', w: 23 }, { label: 'High', w: 34 }].map((seg, i) => (
                            <div key={seg.label} style={{ width: `${seg.w}%` }} className={`h-2 ${i === whtrCat?.index ? (i === 1 ? 'bg-white' : 'bg-orange-500') : 'bg-slate-700'}`} />
                          ))}

                        <div className="absolute -top-1 w-0.5 h-4 bg-white" style={{ left: `${whtrPct}%` }} />

                    </div>

                    {/* V-TAPER DISPLAY CHECKED FROM SHOULDER / WAIST */}
                    <div className="pt-3 border-t border-slate-800">
                      <div className="flex items-center justify-between text-xs font-mono">
                        <span className="text-slate-400">SHOULDER-TO-WAIST V-TAPER</span>
                        <span className="text-white font-bold tabular-nums">
                          {activeShoulderWaistRatio ? `${activeShoulderWaistRatio}:1` : 'Enter Shoulder & Waist'}
                        </span>
                      </div>
                      {vTaperStatus && (
                        <div className={`text-[11px] font-mono mt-0.5 ${vTaperStatus.color}`}>
                          {vTaperStatus.label}
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="mt-4 py-6 border border-dashed border-slate-700 text-center px-4">
                    <div className="text-sm font-semibold text-white">Add Height & Waist</div>
                    <p className="text-xs text-slate-400 mt-1">Keep waist circumference below half your height (&lt; 0.50) for optimal metabolic health.</p>

              <form onSubmit={handleSaveHeightQuick} className="mt-4 pt-3 border-t border-slate-800 flex items-center gap-2">
                <label className="text-[11px] font-mono uppercase text-slate-400 whitespace-nowrap">Height (cm):</label>
                <input type="number" step="0.5" min="90" max="250" value={heightInputCm} onChange={(e) => setHeightInputCm(e.target.value)} placeholder="178" className="w-24 bg-slate-950 border border-slate-700 px-2.5 py-1 text-xs font-mono font-bold text-white focus:outline-none focus:border-white" />
                <button type="submit" className="px-3 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] font-bold text-white">Save Height</button>
              </form>
            </div>
          </div>

          {latest && (
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-px bg-slate-800 border border-slate-800">
              {[{ label: 'Waist', cur: latest.waistCm, prev: previous?.waistCm }, { label: 'Neck', cur: latest.neckCm, prev: previous?.neckCm }, { label: 'Shoulders', cur: latest.shouldersCm, prev: previous?.shouldersCm }, { label: 'Chest', cur: latest.chestCm, prev: previous?.chestCm }, { label: 'Arms', cur: latest.armsCm, prev: previous?.armsCm }, { label: 'Thigh', cur: latest.thighCm, prev: previous?.thighCm }].map((item) => {
                const d = deltaDisp(item.cur, item.prev);
                return (
                  <div key={item.label} className="bg-slate-900 p-4">
                    <div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">{item.label}</div>
                    <div className="text-2xl font-bold text-white font-mono tabular-nums mt-1">{disp(item.cur)} <span className="text-xs font-normal text-slate-400">{mUnit}</span></div>
                    <div className="text-[11px] font-mono text-slate-400 mt-0.5">{d === null ? formatShortDate(latest.date) : `${d > 0 ? '+' : ''}${d} ${mUnit} vs prev`}</div>
                  </div>
                );
              })}
            </div>
          )}

          {/* MEASUREMENT LOG FORM WITH PRELOAD BUTTON */}
          <form onSubmit={handleSave} className="bg-slate-900 border border-slate-800 p-4 sm:p-5 space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <div className="text-[11px] font-mono uppercase tracking-widest text-slate-400">Log Tape Measurements ({mUnit.toUpperCase()})</div>
                <div className="text-[11px] font-mono text-slate-500">Shoulder &amp; waist values immediately calculate your V-Taper ratio</div>
              </div>
              {latest && (
                <button
                  type="button"
                  onClick={handlePreloadLast}
                  className="px-3 py-1.5 bg-slate-950 hover:bg-slate-800 border border-orange-500/70 text-orange-400 hover:text-white text-xs font-mono font-bold flex items-center gap-1.5 transition"
                >
                  <Icons.RotateCcw className="w-3.5 h-3.5" /> Preload from Last ({formatShortDate(latest.date)})
                </button>
              )}
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-9 gap-3 items-end">
              <div className="col-span-2 sm:col-span-2">
                <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">Date</label>
                <input type="date" value={dateVal} max={todayISO()} onChange={(e) => setDateVal(e.target.value)} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-white" />
              </div>
              <div>
                <label className="block text-[11px] font-mono uppercase text-orange-400 mb-1">Waist ({mUnit}) *</label>
                <input type="number" step="0.1" min="0" inputMode="decimal" value={waistInput} onChange={(e) => setWaistInput(e.target.value)} placeholder={mUnit === 'in' ? '32.0' : '81.5'} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-mono font-bold text-white focus:outline-none focus:border-orange-500" />
              </div>
              <div>
                <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">Neck ({mUnit})</label>
                <input type="number" step="0.1" min="0" inputMode="decimal" value={neckInput} onChange={(e) => setNeckInput(e.target.value)} placeholder={mUnit === 'in' ? '15.5' : '39.0'} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-mono font-bold text-white focus:outline-none focus:border-white" />
              </div>
              <div>
                <label className="block text-[11px] font-mono uppercase text-orange-400 mb-1">Shoulders ({mUnit})</label>
                <input type="number" step="0.1" min="0" inputMode="decimal" value={shouldersInput} onChange={(e) => setShouldersInput(e.target.value)} placeholder={mUnit === 'in' ? '48.0' : '122.0'} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-mono font-bold text-white focus:outline-none focus:border-orange-500" />
              </div>
              <div>
                <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">Chest ({mUnit})</label>
                <input type="number" step="0.1" min="0" inputMode="decimal" value={chestInput} onChange={(e) => setChestInput(e.target.value)} placeholder={mUnit === 'in' ? '41.5' : '106.0'} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-mono font-bold text-white focus:outline-none focus:border-white" />
              </div>
              <div>
                <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">Arms ({mUnit})</label>
                <input type="number" step="0.1" min="0" inputMode="decimal" value={armsInput} onChange={(e) => setArmsInput(e.target.value)} placeholder={mUnit === 'in' ? '15.2' : '38.5'} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-mono font-bold text-white focus:outline-none focus:border-white" />
              </div>
              <div>
                <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">Thigh ({mUnit})</label>
                <input type="number" step="0.1" min="0" inputMode="decimal" value={thighInput} onChange={(e) => setThighInput(e.target.value)} placeholder={mUnit === 'in' ? '23.0' : '58.5'} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-mono font-bold text-white focus:outline-none focus:border-white" />
              </div>

                <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">Weight ({weightUnit})</label>
                <input type="number" step="0.1" min="0" inputMode="decimal" value={weightInput} onChange={(e) => setWeightInput(e.target.value)} placeholder="Optional" className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-mono font-bold text-white focus:outline-none focus:border-white" />
              </div>
            </div>

            {/* LIVE V-TAPER CHECK BANNER */}
            {activeShoulderWaistRatio && (
              <div className="px-3.5 py-2 bg-slate-950 border border-slate-800 flex flex-wrap items-center justify-between gap-2 text-xs font-mono">
                <span className="text-slate-400">
                  Calculated V-Taper: <strong className="text-white">{activeShoulderWaistRatio}:1</strong>
                  {inputShoulders > 0 && inputWaist > 0 ? ' (Live from current inputs)' : ' (Saved)'}
                </span>
                <span className={vTaperStatus ? vTaperStatus.color : 'text-slate-400'}>
                  {vTaperStatus ? vTaperStatus.label : ''}
                </span>
              </div>
