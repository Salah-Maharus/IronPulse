            {sex === 'female' && (
              <div className="max-w-xs">
                <label className="block text-[11px] font-mono uppercase text-orange-400 mb-1">Hips ({mUnit}) — Required for Female Navy BF%</label>
                <input type="number" step="0.1" min="0" inputMode="decimal" value={hipsInput} onChange={(e) => setHipsInput(e.target.value)} placeholder={mUnit === 'in' ? '38.0' : '96.0'} className="w-full bg-slate-950 border border-slate-800 px-3 py-2 text-sm font-mono font-bold text-white focus:outline-none focus:border-orange-500" />
              </div>
            )}
            {formError && <div className="text-xs font-mono text-orange-400">! {formError}</div>}
            <div className="flex justify-end">
              <button type="submit" className="px-5 py-2.5 bg-white hover:bg-slate-300 text-slate-950 text-xs sm:text-sm font-extrabold flex items-center gap-1.5"><Icons.Plus className="w-4 h-4" /> Log Measurements</button>
            </div>
          </form>

          <div className="bg-slate-900 border border-slate-800">
            <div className="px-4 sm:px-5 py-3 border-b border-slate-800 flex items-center justify-between">
              <h2 className="text-lg font-bold text-white">Measurement History</h2>
              <span className="text-xs font-mono text-slate-400">{sorted.length} entr{sorted.length === 1 ? 'y' : 'ies'} ({mUnit})</span>
            </div>
            {sorted.length === 0 ? (
              <div className="p-8 text-center">
                <Icons.Ruler className="w-7 h-7 text-slate-600 mx-auto mb-2" />
                <p className="text-sm font-semibold text-slate-300">No tape measurements logged yet</p>
                <p className="text-xs text-slate-400 mt-1">Enter your waist, neck, shoulders, chest, arms & thigh measurements above to track body recomposition.</p>
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-[11px] font-mono uppercase tracking-widest text-slate-400 text-left">
                      <th className="px-4 py-2.5 font-semibold">Date</th><th className="px-3 py-2.5 font-semibold text-right">Waist</th><th className="px-3 py-2.5 font-semibold text-right">Neck</th><th className="px-3 py-2.5 font-semibold text-right">Shoulders</th><th className="px-3 py-2.5 font-semibold text-right">Chest</th><th className="px-3 py-2.5 font-semibold text-right">Arms</th><th className="px-3 py-2.5 font-semibold text-right">Thigh</th><th className="px-3 py-2.5 font-semibold text-right">Navy BF%</th><th className="px-3 py-2.5 font-semibold text-right">WHtR</th><th className="px-4 py-2.5 text-right"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {sorted.map((m) => {
                      const rowBF = calcNavyBodyFat({ sex, heightCm, waistCm: m.waistCm, neckCm: m.neckCm, hipsCm: m.hipsCm });
                      const rowRatio = calcWaistToHeightRatio(m.waistCm, heightCm);
                      return (
                        <tr key={m.id} className="border-t border-slate-800">
                          <td className="px-4 py-2.5 font-mono text-slate-200 whitespace-nowrap">{formatDateLabel(m.date)}</td>
                          <td className="px-3 py-2.5 font-mono font-bold text-white text-right tabular-nums">{disp(m.waistCm)}</td>
                          <td className="px-3 py-2.5 font-mono text-slate-300 text-right tabular-nums">{disp(m.neckCm)}</td>
                          <td className="px-3 py-2.5 font-mono text-slate-300 text-right tabular-nums">{disp(m.shouldersCm)}</td>
                          <td className="px-3 py-2.5 font-mono text-slate-300 text-right tabular-nums">{disp(m.chestCm)}</td>
                          <td className="px-3 py-2.5 font-mono text-slate-300 text-right tabular-nums">{disp(m.armsCm)}</td>
                          <td className="px-3 py-2.5 font-mono text-slate-300 text-right tabular-nums">{disp(m.thighCm)}</td>
                          <td className="px-3 py-2.5 font-mono font-bold text-orange-400 text-right tabular-nums">{rowBF !== null ? `${rowBF}%` : '—'}</td>
                          <td className="px-3 py-2.5 font-mono text-white text-right tabular-nums">{rowRatio !== null ? rowRatio : '—'}</td>
                          <td className="px-4 py-2.5 text-right whitespace-nowrap">
                            {confirmDeleteId === m.id ? (
                              <span className="inline-flex gap-1">
                                <button type="button" onClick={() => { onDeleteMeasurement(m.id); setConfirmDeleteId(null); }} className="px-2.5 py-1 bg-orange-500 text-white text-xs font-bold">Confirm</button>
                                <button type="button" onClick={() => setConfirmDeleteId(null)} className="px-2 py-1 border border-slate-700 text-slate-300 text-xs">Cancel</button>
                              </span>
                            ) : (
                              <button type="button" onClick={() => setConfirmDeleteId(m.id)} className="p-1.5 text-slate-400 hover:text-orange-500"><Icons.Trash2 className="w-4 h-4" /></button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ========================================================================
    // 8C. GEMINI AI COACH VIEW
    // ========================================================================
const CoachView = ({ userData, allExercises }) => {
      const [messages, setMessages] = useState(() => safeReadJSON(STORAGE_KEYS.COACH_HISTORY, []));
      const [coachRole, setCoachRole] = useState('strength');
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // Active API models: gemini-3.8-flash (Recommended), gemini-4-hydrogen, gemini-3.5-flash-lite
      const AVAILABLE_MODELS = [
        { id: 'gemini-3.8-flash', name: 'Gemini 3.8 Flash', desc: 'Ultra-fast & responsive (Recommended)' },
        { id: 'gemini-4-hydrogen', name: 'Gemini 4 Hydrogen', desc: 'Deep biomechanical reasoning & analysis' },
        { id: 'gemini-3.5-flash-lite', name: 'Gemini 3.5 Flash-Lite', desc: 'Lightweight & efficient low-latency' },
      ];

      const [apiKey, setApiKey] = useState(() => safeReadJSON('ironpulse_gemini_key', ''));
      const [keyInputVal, setKeyInputVal] = useState(apiKey);
      const [showKeyPassword, setShowKeyPassword] = useState(false);
      const [showGuideModal, setShowGuideModal] = useState(false);
      const [selectedModel, setSelectedModel] = useState(() => {
        const saved = safeReadJSON('ironpulse_gemini_model', 'gemini-3.8-flash');
        return AVAILABLE_MODELS.some((m) => m.id === saved) ? saved : 'gemini-3.8-flash';
      });
      const [isOnline, setIsOnline] = useState(() => (typeof navigator !== 'undefined' ? navigator.onLine : true));
      const threadEndRef = useRef(null);

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      useEffect(() => { safeWriteJSON(STORAGE_KEYS.COACH_HISTORY, messages); }, [messages]);
      useEffect(() => { safeWriteJSON('ironpulse_gemini_key', apiKey); }, [apiKey]);
      useEffect(() => { safeWriteJSON('ironpulse_gemini_model', selectedModel); }, [selectedModel]);
      useEffect(() => { threadEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, loading]);

      const hasGeminiActive = Boolean(isOnline && apiKey.trim());

      const roles = [
        { id: 'strength', label: 'Strength Coach', subtitle: 'Programming, overload & RPE autoregulation' },
        { id: 'biomechanics', label: 'Form Analyst', subtitle: 'Bar path, joint alignment & tactical cues' },
        { id: 'research', label: 'Sports Researcher', subtitle: 'Nutrition, energy balance & recovery science' },
      ];

      const athleteContext = useMemo(() => {
        const bwEntries = getBodyEntries(userData.bodyWeights, userData.unit);
        const latestBw = bwEntries.length > 0 ? bwEntries[bwEntries.length - 1] : null;
        const topLifts = allExercises
          .map((ex) => {
            const st = getExerciseAnalytics(ex.id, userData.workouts);
            return st.bestSet && st.best1RM > 0 ? { id: ex.id, name: ex.name, bestSet: `${st.bestSet.weight}${userData.unit} × ${st.bestSet.reps}`, est1RM: st.best1RM } : null;
          })
          .filter(Boolean)
          .sort((a, b) => b.est1RM - a.est1RM)
          .slice(0, 6);
        return {
          unit: userData.unit,
          workoutCount: userData.workouts.length,
          latestBodyWeight: latestBw ? { weight: latestBw.value, unit: userData.unit, date: latestBw.date } : null,
          activeWorkout: userData.activeWorkout ? { name: userData.activeWorkout.name, exercises: userData.activeWorkout.exercises.map((e) => e.name) } : null,
          topLifts,
          recentWorkouts: userData.workouts.slice(0, 7).map((w) => ({ name: w.name, date: w.date, exercises: (w.exercises || []).map((e) => ({ id: e.exerciseId, name: e.name, muscleGroup: e.muscleGroup, sets: e.sets })) })),
        };
      }, [userData, allExercises]);

      // ========================================================================
      // DEEP LOCAL FITNESS INTELLIGENCE ENGINE
      // ========================================================================
      const FORM_DICTIONARY = {
        squat: {
          movement: 'Barbell Back Squat',
          cues: [
            '**Tripod Foot Rooting:** Claw the floor through big toe, pinky toe, and heel to create active arches.',
            '**360° Diaphragmatic Brace:** Expand ribs and abdomen outward against your core; never just suck your stomach in.',
            '**Hole Turnaround:** Avoid bouncing on tendons at the bottom. Maintain lat tension and drive traps straight up into the bar.',
          ],
          alternatives: 'Goblet Squat (mobility & upright depth), Machine Hack Squat (high quad tension with zero spinal compression).',
        },
        bench: {
          movement: 'Barbell Bench Press',
          cues: [
            '**Scapular Retraction & Depression:** Pinch shoulder blades together and screw them down into the pad like tucking into rear pockets.',
            '**Elbow Flare Control:** Tuck elbows ~45° from your torso on descent to protect anterior delts and maximize pec recruitment.',
            '**Horizontal Leg Drive:** Push feet forward into floor to drive torso firmly into the bench without hips lifting.',
          ],
          alternatives: 'Incline Dumbbell Press (deeper stretch & unilateral balance), Weighted Chest Dips.',
        },
        deadlift: {
          movement: 'Conventional Deadlift',
          cues: [
            '**Slack Pull & Lat Wedge:** Pull the click out of the bar before driving. Think of bending the barbell across your shins.',
            '**Push the Floor Away:** Treat the first half of the pull as a leg press rather than yanking with your lumbar spine.',
            '**Glute Lockout:** Squeeze glutes through to the bar; avoid leaning backward at lockout.',
          ],
          alternatives: 'Romanian Deadlift (pure posterior chain tension), Trap Bar Deadlift.',
        },
        ohp: {
          movement: 'Overhead Barbell Press',
          cues: [
            '**Glute & Ab Clench:** Squeeze glutes and abs at maximum tension to lock pelvis in place and prevent lower back arching.',
            '**Head through Window:** Pull chin back as bar clears face, then push head through as the bar locks out over shoulder joints.',
            '**Forearm Stack:** Keep wrists directly stacked over elbows throughout the entire pressing path.',
          ],
          alternatives: 'Seated Dumbbell Shoulder Press (scapular plane safety), Arnold Press.',
        },
        row: {
          movement: 'Bent-Over Barbell Row',
          cues: [
            '**Hinge Integrity:** Lock hips back with soft knees and maintain a flat spine. Avoid jerking torso upward to heave weight.',
            '**Pull to Navel:** Drive elbows back toward hip pockets rather than straight up to shoulders to target lats.',
            '**Controlled Eccentric:** Resist lowering for 1.5–2 seconds; do not let gravity drop the load.',
          ],
          alternatives: 'Chest-Supported T-Bar Row (zero lumbar fatigue), Single-Arm Dumbbell Row.',
        },
      };

      const generateDeepLocalCoachReply = (promptText, role) => {
        const u = userData.unit;
        const pLower = promptText.toLowerCase();

        // Check Form Dictionary for cues and alternative substitutions
        for (const [key, item] of Object.entries(FORM_DICTIONARY)) {
          if (pLower.includes(key) || (key === 'ohp' && (pLower.includes('press') || pLower.includes('overhead')))) {
            return `### ${item.movement} — Biomechanics & Execution Guide\n\n**Tactical Mechanical Cues:**\n${item.cues.map((c) => `- ${c}`).join('\n')}\n\n**Biomechanically Preferred Substitutes:**\n${item.alternatives}\n\n*Analyzed from IronPulse Local Exercise Database.*`;
          }
        }

        // Scan history for Plateau & Fatigue Detection (> 3 sessions with no 1RM gain)
        const plateauAlerts = [];
        athleteContext.topLifts.slice(0, 4).forEach((lift) => {
          const stats = getExerciseAnalytics(lift.id, userData.workouts);
          if (stats.points && stats.points.length >= 3) {
            const recentPoints = stats.points.slice(-3);
            const peak1RM = Math.max(...recentPoints.map((p) => p.est1RM));
            const firstOfThree = recentPoints[0].est1RM;
            if (peak1RM <= firstOfThree) {
              plateauAlerts.push({
                name: lift.name,
                sessions: recentPoints.length,
                current1RM: peak1RM,
              });
            }
          }
        });

        // Split Balance & Muscle Recovery Tracker (calculate frequency over last 7 days)
        const muscleHits = { Chest: 0, Back: 0, Legs: 0, Shoulders: 0, Arms: 0, Core: 0 };
        athleteContext.recentWorkouts.forEach((w) => {
          (w.exercises || []).forEach((e) => {
            const group = e.muscleGroup || '';
            if (group.includes('Chest')) muscleHits.Chest++;
            else if (group.includes('Back')) muscleHits.Back++;
            else if (group.includes('Legs')) muscleHits.Legs++;
            else if (group.includes('Shoulders')) muscleHits.Shoulders++;
            else if (group.includes('Biceps') || group.includes('Triceps') || group.includes('Forearms')) muscleHits.Arms++;
            else if (group.includes('Core')) muscleHits.Core++;
          });
        });

        let recommendedToday = 'Push (Chest & Shoulders)';
        if (muscleHits.Legs <= muscleHits.Chest && muscleHits.Legs <= muscleHits.Back) {
          recommendedToday = 'Leg Day (Quads & Posterior Chain)';
        } else if (muscleHits.Back <= muscleHits.Chest) {
          recommendedToday = 'Pull Day (Back & Biceps)';
        } else if (muscleHits.Chest > 2 && muscleHits.Back > 2 && muscleHits.Legs > 2) {
          recommendedToday = 'Active Recovery / Mobility Session';
        }

        // Advanced Progressive Overload Next-Session Plan
        const overloadCalculations = [];
        if (userData.activeWorkout && userData.activeWorkout.exercises.length > 0) {
          userData.activeWorkout.exercises.forEach((ex) => {
            const st = getExerciseAnalytics(ex.exerciseId, userData.workouts);
            const inc = u === 'lbs' ? 5 : 2.5;
            if (st.bestSet) {
              const nextWeight = st.bestSet.reps >= 10 ? round1(st.bestSet.weight + inc) : st.bestSet.weight;
              const nextReps = st.bestSet.reps >= 10 ? Math.max(6, st.bestSet.reps - 2) : st.bestSet.reps + 1;
              overloadCalculations.push(`- **${ex.name}:** Last best was ${st.bestSet.weight}${u} × ${st.bestSet.reps} reps. **Target today: ${nextWeight}${u} × ${nextReps} reps**`);
            }
          });
        } else {
          athleteContext.topLifts.slice(0, 3).forEach((lift) => {
            const inc = u === 'lbs' ? 5 : 2.5;
            const st = getExerciseAnalytics(lift.id, userData.workouts);
            if (st.bestSet) {
              const nextWeight = st.bestSet.reps >= 8 ? round1(st.bestSet.weight + inc) : st.bestSet.weight;
              const nextReps = st.bestSet.reps >= 8 ? Math.max(5, st.bestSet.reps - 2) : st.bestSet.reps + 1;
              overloadCalculations.push(`- **${lift.name}:** Last best ${st.bestSet.weight}${u} × ${st.bestSet.reps}. Target next: **${nextWeight}${u} × ${nextReps}**`);
            }
          });
        }

        let report = `### Deep Local Fitness Analysis (Offline)\n\n`;

        // Section 1: Overload Targets
        report += `**1. Precise Progressive Overload Targets:**\n`;
        if (overloadCalculations.length > 0) {
          report += overloadCalculations.join('\n') + '\n\n';
        } else {
          report += `- Log working sets across 2+ sessions to calculate exact mathematical micro-loading targets.\n\n`;
        }

        // Section 2: Plateau & Fatigue Detection
        report += `**2. Plateau & Fatigue Diagnostics:**\n`;
        if (plateauAlerts.length > 0) {
          report += plateauAlerts.map((p) => `- ⚠️ **${p.name}:** Stagnated around ${p.current1RM}${u} 1RM across the last ${p.sessions} logged exposures. **Prescription:** Apply a 1-week 10% deload or switch from heavy triples to 8–10 rep hypertrophic micro-cycles.`).join('\n') + '\n\n';
        } else {
          report += `- ✅ **No plateaus detected.** Your logged movements are continuing to progress in calculated 1RM and volume.\n\n`;
        }

        // Section 3: Split Balance
        report += `**3. Split Balance & Muscle Recovery Tracker:**\n`;
        report += `- Recent 7-day exposures: Chest: **${muscleHits.Chest}**, Back: **${muscleHits.Back}**, Legs: **${muscleHits.Legs}**, Shoulders: **${muscleHits.Shoulders}**.\n`;
        report += `- **Tactical Recommendation:** Focus on **${recommendedToday}** to preserve recovery balance.\n\n`;

        // Section 4: Nutrition Anchor
        if (athleteContext.latestBodyWeight) {
          const bwVal = athleteContext.latestBodyWeight.weight;
          const pMin = Math.round(bwVal * (u === 'lbs' ? 0.82 : 1.8));
          const pMax = Math.round(bwVal * (u === 'lbs' ? 1.0 : 2.2));
          report += `**4. Recovery Anchor:** Aim for **${pMin}–${pMax}g protein/day** based on your latest ${bwVal}${u} weigh-in.`;
        }

        return report;
      };

      const renderInlineBold = (line) => {
        const parts = String(line).split(/(\*\*[^*]+\*\*)/g);
        return parts.map((seg, idx) =>
          seg.startsWith('**') && seg.endsWith('**') && seg.length > 4
            ? <strong key={idx} className="font-bold text-white">{seg.slice(2, -2)}</strong>
            : <React.Fragment key={idx}>{seg}</React.Fragment>
        );
      };

      const renderBody = (text) => (
        <div className="space-y-1.5 text-sm leading-relaxed text-slate-200">
          {String(text).split('\n').map((rawLine, idx) => {
            const trimmed = rawLine.trim();
            if (!trimmed) return <div key={idx} className="h-1" />;
            if (trimmed.startsWith('### ') || trimmed.startsWith('## ')) {
              return <div key={idx} className="font-bold text-white pt-1 tracking-wide">{trimmed.replace(/^#{2,3}\s+/, '')}</div>;
            }
            if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
              return (
                <div key={idx} className="flex items-start gap-2 pl-1">
                  <span className="text-orange-400 font-mono text-xs mt-1 shrink-0">▪</span>
                  <span className="min-w-0 flex-1">{renderInlineBold(trimmed.slice(2))}</span>
                </div>
              );
            }
            return <p key={idx}>{renderInlineBold(rawLine)}</p>;
          })}
        </div>
      );

      const sendMessage = async (overrideText) => {
        const promptText = (overrideText !== undefined ? overrideText : input).trim();
        if (!promptText || loading) return;
        setErrorMsg('');
        const userMsg = { id: `cm-${uid()}`, role: 'user', text: promptText, createdAt: new Date().toISOString() };
        const nextHistory = [...messages, userMsg];
        setMessages(nextHistory);
        if (overrideText === undefined) setInput('');
        setLoading(true);

        if (hasGeminiActive) {
          try {
            const roleInstruction = roles.find((r) => r.id === coachRole)?.subtitle || 'Strength & Conditioning coach';
            const systemPrompt = `You are the IronPulse ${coachRole.toUpperCase()} Coach. ${roleInstruction}. Give direct, actionable fitness programming grounded in progressive overload. Keep explanations crisp, structured, and free of fluff.
ATHLETE CONTEXT:
- Preferred weight unit: ${athleteContext.unit}
- Completed workouts: ${athleteContext.workoutCount}
- Body weight: ${athleteContext.latestBodyWeight ? `${athleteContext.latestBodyWeight.weight} ${athleteContext.latestBodyWeight.unit}` : 'None logged'}
- Top lifts: ${athleteContext.topLifts.map((l) => `${l.name} (${l.bestSet}, 1RM ${l.est1RM}${athleteContext.unit})`).join('; ') || 'None'}
- Active session: ${athleteContext.activeWorkout ? athleteContext.activeWorkout.name : 'None'}`;

            const geminiContents = [
              { role: 'user', parts: [{ text: systemPrompt }] },
              ...nextHistory.map((m) => ({
                role: m.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: m.text }],
              })),
            ];

            // Injects the chosen active model into endpoint URL
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(selectedModel)}:generateContent?key=${encodeURIComponent(apiKey.trim())}`;
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: geminiContents }),
            });

            const data = await res.json();
            if (!res.ok) {
              throw new Error(data?.error?.message || `Gemini request failed (${res.status})`);
            }

            const candidate = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!candidate) throw new Error('Gemini returned an empty reply.');

            setMessages((prev) => [...prev, {
              id: `cm-${uid()}`,
              role: 'assistant',
              text: candidate.trim(),
              modelUsed: selectedModel,
              createdAt: new Date().toISOString(),
            }]);
          } catch (err) {
            const fallbackReply = generateDeepLocalCoachReply(promptText, coachRole);
            setMessages((prev) => [...prev, {
              id: `cm-${uid()}`,
              role: 'assistant',
              text: `${fallbackReply}\n\n*(Note: Gemini ${selectedModel} returned an error: "${err.message}". Switched to IronPulse Deep Local Engine.)*`,
              modelUsed: 'deep-local-coach',
              createdAt: new Date().toISOString(),
            }]);
          } finally {
            setLoading(false);
          }
        } else {
          // Deep local analysis with quick response
          setTimeout(() => {
            const reply = generateDeepLocalCoachReply(promptText, coachRole);
            setMessages((prev) => [...prev, {
              id: `cm-${uid()}`,
              role: 'assistant',
              text: reply,
              modelUsed: 'deep-local-coach',
              createdAt: new Date().toISOString(),
            }]);
            setLoading(false);
          }, 250);
        }
      };

      const handleSaveKey = () => {
        setApiKey(keyInputVal.trim());
        setShowGuideModal(false);
      };

      const quickPrompts = [
        `Analyze my progressive overload targets and fatigue alerts based on my history.`,
        'What bracing and foot-rooting cues fix sticking points out of the hole on Barbell Back Squat?',
        'Evaluate my current split balance and recommend what muscle groups I should train today.',
        'Give me the exact mechanical cues and safe alternatives for Bench Press.',
      ];

      return (
        <div className="space-y-4">
          {/* Header Bar with Live Hybrid Badge */}
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-2xl font-extrabold text-white">Performance Coach</h1>
                {hasGeminiActive ? (
                  <span className="px-2 py-0.5 bg-emerald-500/15 border border-emerald-500/60 text-emerald-400 font-mono text-[10px] font-extrabold tracking-wider">
                    [ ONLINE • {selectedModel.toUpperCase()} ]
                  </span>
                ) : (
                  <span className="px-2 py-0.5 bg-slate-900 border border-slate-700 text-slate-400 font-mono text-[10px] font-extrabold tracking-wider">
                    [ OFFLINE • LOCAL SMART COACH ]
                  </span>
                )}
              </div>
              <div className="text-xs font-mono text-slate-400 mt-0.5">
                {hasGeminiActive ? `DIRECT GOOGLE GEMINI API ACTIVE · MODEL: ${selectedModel}` : 'DEEP LOCAL FITNESS ENGINE (OVERLOAD, PLATEAUS & SPLIT BALANCE)'}
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => setShowGuideModal(true)}
                className={`px-3 py-1.5 border text-xs font-mono flex items-center gap-1.5 transition ${
                  apiKey ? 'bg-slate-900 border-slate-700 text-slate-200' : 'bg-orange-500 border-orange-500 text-white font-bold'
                }`}
              >
                <Icons.Settings className="w-3.5 h-3.5" />

    };
   
    // ========================================================================
    // 9. MAIN APPLICATION SHELL
    // ========================================================================
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const session = safeReadJSON(STORAGE_KEYS.SESSION, null);
        if (!session?.userId) return null;
        if (session.userId === 'usr-guest') {
          return { id: 'usr-guest', name: 'Guest Athlete', email: 'local@device', passwordHash: '', createdAt: new Date().toISOString(), isGuest: true };
        }
        const users = safeReadJSON(STORAGE_KEYS.USERS, []);
        return users.find((u) => u.id === session.userId) || null;
      });

      const [userData, setUserData] = useState(() => {
        if (!currentUser) return getDefaultUserData();
        const saved = safeReadJSON(`${STORAGE_KEYS.USER_DATA_PREFIX}${currentUser.id}`, null);
        if (saved) return normalizeUserData(saved);
        if (currentUser.isGuest) {
          const legacyGuest = safeReadJSON(STORAGE_KEYS.GUEST_DATA, null);
          if (legacyGuest) return normalizeUserData(legacyGuest);
        }
        return getDefaultUserData();
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [inspectExercise, setInspectExercise] = useState(null);
      const [customModalExercise, setCustomModalExercise] = useState(undefined);
      const [showExercisePicker, setShowExercisePicker] = useState(false);
      const [selectedHistoryWorkout, setSelectedHistoryWorkout] = useState(null);
      const [workoutSummary, setWorkoutSummary] = useState(null);
      const [toasts, setToasts] = useState([]);

      const [utilityMenuOpen, setUtilityMenuOpen] = useState(false);
      const utilityMenuRef = useRef(null);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showFeedbackModal, setShowFeedbackModal] = useState(false);
      const [oneRMModalExId, setOneRMModalExId] = useState(null);
      const [plateModalState, setPlateModalState] = useState(null);

      // Wall-clock background rest timer
      const [restRemaining, setRestRemaining] = useState(userData.restSettings?.duration || 90);
      const [restRunning, setRestRunning] = useState(false);
      const restEndTimeRef = useRef(null);
      const chimeFiredRef = useRef(false);
      const mutedRef = useRef(Boolean(userData.restSettings?.muted));
      useEffect(() => { mutedRef.current = Boolean(userData.restSettings?.muted); }, [userData.restSettings?.muted]);

      const pushToast = useCallback((message, type = 'success') => {
        const id = uid();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 3800);
      }, []);

      useEffect(() => {
        if (currentUser) safeWriteJSON(`${STORAGE_KEYS.USER_DATA_PREFIX}${currentUser.id}`, userData);
      }, [userData, currentUser]);

      useEffect(() => {
        const out = (e) => { if (utilityMenuRef.current && !utilityMenuRef.current.contains(e.target)) setUtilityMenuOpen(false); };
        if (utilityMenuOpen) document.addEventListener('mousedown', out);
        return () => document.removeEventListener('mousedown', out);
      }, [utilityMenuOpen]);

      useEffect(() => {
        if (!restRunning) { document.title = 'IronPulse — Progressive Overload Training Log'; return; }
        const syncClock = () => {
          if (restEndTimeRef.current === null) return;
          const secsLeft = Math.max(0, Math.ceil((restEndTimeRef.current - Date.now()) / 1000));
          setRestRemaining(secsLeft);
          if (secsLeft > 0) {
            document.title = `[${formatTimerClock(secsLeft)}] REST — IronPulse`;
          } else {
            document.title = '[00:00] REST DONE — IronPulse';
            if (!chimeFiredRef.current) {
              chimeFiredRef.current = true;
              setRestRunning(false);
              restEndTimeRef.current = null;
              const now = Date.now();
              setUserData((prev) => {
                if (!prev.activeWorkout?.restLog?.some((r) => r.status === 'resting')) return prev;
                return { ...prev, activeWorkout: { ...prev.activeWorkout, restLog: closeOpenRestEntries(prev.activeWorkout.restLog, 'done', now), updatedAt: new Date(now).toISOString() } };
              });
              if (!mutedRef.current) playIndustrialChime();
              pushToast('Rest complete! Time for your next set.', 'success');
            }
          }
        };
        syncClock();
        const id = setInterval(syncClock, 250);
        const onVis = () => { if (document.visibilityState === 'visible') syncClock(); };
        document.addEventListener('visibilitychange', onVis);
        return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVis); };
      }, [restRunning, pushToast]);

      const restDuration = userData.restSettings?.duration || 90;
      const closeOpenRestEntries = (restLog, status, nowMs = Date.now()) => {
        if (!Array.isArray(restLog) || restLog.length === 0) return [];
        const nowIso = new Date(nowMs).toISOString();
        return restLog.map((entry) =>
          entry.status === 'resting'
            ? { ...entry, endedAt: nowIso, durationSeconds: Math.max(1, Math.round((nowMs - new Date(entry.startedAt).getTime()) / 1000)), status }
            : entry
        );
      };

      const handleStartRest = useCallback((customSecs, restLabel) => {
        unlockAudioContext();
        const target = typeof customSecs === 'number' ? customSecs : restRemaining === 0 ? restDuration : restRemaining;
        const now = Date.now();
        chimeFiredRef.current = false;
        restEndTimeRef.current = now + target * 1000;
        setRestRemaining(target);
        setRestRunning(true);
        setUserData((prev) => {
          if (!prev.activeWorkout || prev.activeWorkout.editingHistoryId) return prev;
          const closed = closeOpenRestEntries(prev.activeWorkout.restLog, 'next', now);
          const newEntry = { id: `rest-${uid()}`, label: restLabel || 'Manual Rest', startedAt: new Date(now).toISOString(), plannedSeconds: target, status: 'resting' };
          return { ...prev, activeWorkout: { ...prev.activeWorkout, restLog: [...closed, newEntry], updatedAt: new Date(now).toISOString() } };
        });
      }, [restRemaining, restDuration]);

      const handlePauseRest = useCallback(() => {
        const now = Date.now();
        if (restEndTimeRef.current !== null) setRestRemaining(Math.max(0, Math.ceil((restEndTimeRef.current - now) / 1000)));
        restEndTimeRef.current = null;
        setRestRunning(false);
        document.title = 'IronPulse — Progressive Overload Training Log';
        setUserData((prev) => {
          if (!prev.activeWorkout?.restLog?.some((r) => r.status === 'resting')) return prev;
          return { ...prev, activeWorkout: { ...prev.activeWorkout, restLog: closeOpenRestEntries(prev.activeWorkout.restLog, 'stopped', now), updatedAt: new Date(now).toISOString() } };
        });
      }, []);

      const handleResetRest = () => {
        restEndTimeRef.current = null; chimeFiredRef.current = false; setRestRunning(false); setRestRemaining(restDuration);
        const now = Date.now();
        setUserData((prev) => {
          if (!prev.activeWorkout?.restLog?.some((r) => r.status === 'resting')) return prev;
          return { ...prev, activeWorkout: { ...prev.activeWorkout, restLog: closeOpenRestEntries(prev.activeWorkout.restLog, 'done', now), updatedAt: new Date(now).toISOString() } };
        });
      };

      const handleAdjustRest = (delta) => {
        if (restRunning && restEndTimeRef.current !== null) {
          const next = Math.max(5, Math.min(900, Math.ceil((restEndTimeRef.current - Date.now()) / 1000) + delta));
          restEndTimeRef.current = Date.now() + next * 1000;
          setRestRemaining(next);
        } else setRestRemaining((p) => Math.max(5, Math.min(900, p + delta)));
      };

      const handleAuthSuccess = (user) => {
        safeWriteJSON(STORAGE_KEYS.SESSION, { userId: user.id });
        let saved = safeReadJSON(`${STORAGE_KEYS.USER_DATA_PREFIX}${user.id}`, null);
        if (!saved && user.isGuest) saved = safeReadJSON(STORAGE_KEYS.GUEST_DATA, null);
        const data = normalizeUserData(saved || getDefaultUserData());
        setCurrentUser(user);
        setUserData(data);
        setRestRemaining(data.restSettings?.duration || 90);
        restEndTimeRef.current = null;
        setRestRunning(false);
        setActiveTab('dashboard');
        pushToast(`Welcome, ${user.name}!`);
      };

      const handleDemoLogin = () => {
        const users = safeReadJSON(STORAGE_KEYS.USERS, []);
        let demoUser = users.find((u) => u.email === 'demo@ironpulse.app');
        if (!demoUser) {
          demoUser = { id: 'usr-demo-account', name: 'Jordan Demo', email: 'demo@ironpulse.app', passwordHash: hashPassword('demo1234'), createdAt: new Date().toISOString() };
          safeWriteJSON(STORAGE_KEYS.USERS, [...users, demoUser]);
          safeWriteJSON(`${STORAGE_KEYS.USER_DATA_PREFIX}${demoUser.id}`, createDemoUserData());
        } else if (!safeReadJSON(`${STORAGE_KEYS.USER_DATA_PREFIX}${demoUser.id}`, null)) {
          safeWriteJSON(`${STORAGE_KEYS.USER_DATA_PREFIX}${demoUser.id}`, createDemoUserData());
        }
        handleAuthSuccess(demoUser);
      };

      const handleGuestLogin = () => {
        handleAuthSuccess({ id: 'usr-guest', name: 'Guest Athlete', email: 'local@device', passwordHash: '', createdAt: new Date().toISOString(), isGuest: true });
      };

      const handleSignOut = () => {
        safeRemoveKey(STORAGE_KEYS.SESSION);
        restEndTimeRef.current = null;
        setRestRunning(false);
        setCurrentUser(null);
        setActiveTab('dashboard');
      };

      const allExercises = useMemo(() => [...userData.customExercises, ...BUILT_IN_EXERCISES], [userData.customExercises]);

      const buildExerciseEntry = (exMeta) => {
        const analytics = getExerciseAnalytics(exMeta.id, userData.workouts);
        return {
          id: `we-${uid()}`,
          exerciseId: exMeta.id,
          name: exMeta.name,
          muscleGroup: exMeta.muscleGroup,
          sets: [1, 2, 3].map(() => ({ id: `s-${uid()}`, weight: analytics.bestSet ? analytics.bestSet.weight : 0, reps: analytics.bestSet ? analytics.bestSet.reps : 8, completed: false })),
        };
      };

      const handleSaveCustomExercise = (exerciseObj) => {
        const isEditing = userData.customExercises.some((e) => e.id === exerciseObj.id);
        if (isEditing) {
          setUserData((p) => ({ ...p, customExercises: p.customExercises.map((e) => (e.id === exerciseObj.id ? exerciseObj : e)), updatedAt: new Date().toISOString() }));
          pushToast(`Updated "${exerciseObj.name}"`);
        } else {
          setUserData((p) => ({ ...p, customExercises: [exerciseObj, ...p.customExercises], updatedAt: new Date().toISOString() }));
          pushToast(`Saved custom exercise "${exerciseObj.name}"`);
          if (showExercisePicker && userData.activeWorkout) {
            handleAddExerciseToWorkout(exerciseObj);
            setShowExercisePicker(false);
          }
        }
      };

      const handleDeleteCustomExercise = (exId) => {
        setUserData((p) => ({ ...p, customExercises: p.customExercises.filter((e) => e.id !== exId), updatedAt: new Date().toISOString() }));
        setInspectExercise(null);
        pushToast('Custom exercise deleted');
      };

      const handleStartBlankWorkout = () => {
        setUserData((p) => ({ ...p, activeWorkout: { id: `w-${uid()}`, name: 'Strength Session', date: todayISO(), notes: '', exercises: [], startedAt: new Date().toISOString() } }));
        setActiveTab('workout');
      };

      const handleStartTemplateWorkout = (tpl) => {
        const entries = tpl.ids.map((id) => allExercises.find((e) => e.id === id)).filter(Boolean).map(buildExerciseEntry);
        setUserData((p) => ({ ...p, activeWorkout: { id: `w-${uid()}`, name: tpl.name, date: todayISO(), notes: '', exercises: entries, startedAt: new Date().toISOString() } }));
        setActiveTab('workout');
        pushToast(`Loaded "${tpl.name}" template`);
      };

      const handleAddExerciseToWorkout = (exMeta) => {
        const now = Date.now();
        setUserData((p) => {
          const cur = p.activeWorkout || { id: `w-${uid()}`, name: 'My Workout', date: todayISO(), notes: '', exercises: [], startedAt: new Date(now).toISOString() };
          return { ...p, activeWorkout: { ...cur, restLog: closeOpenRestEntries(cur.restLog, 'next', now), exercises: [...cur.exercises, buildExerciseEntry(exMeta)], updatedAt: new Date(now).toISOString() } };
        });
        setShowExercisePicker(false);
        setActiveTab('workout');
        pushToast(`Added ${exMeta.name} to workout`);
      };

      const handleFinishWorkout = () => {
        const active = userData.activeWorkout;
        if (!active || active.exercises.length === 0) { pushToast('Add at least one exercise before finishing.', 'error'); return; }
        const st = computeWorkoutStats(active);
        if (st.completedSets === 0) { pushToast('Check off at least one completed set.', 'error'); return; }
        const nowMs = Date.now();
        const { editingHistoryId, isPaused: _p, pausedAt: _pa, pausedTotalMs: _pt, ...clean } = active;
        const durationSeconds = clean.durationSeconds || Math.max(1, Math.round(getWorkoutElapsedMs(active, nowMs) / 1000));
        const nowIso = new Date(nowMs).toISOString();
        const closedRestLog = closeOpenRestEntries(clean.restLog, 'done', nowMs);
        const finalized = { ...clean, name: (clean.name || '').trim() || 'Workout Session', durationSeconds, restLog: closedRestLog.length > 0 ? closedRestLog : undefined, completedAt: clean.completedAt || nowIso, updatedAt: nowIso };
        const prior = editingHistoryId ? userData.workouts.filter((w) => w.id !== editingHistoryId) : userData.workouts;
        const prsHit = [];
        finalized.exercises.forEach((ex) => {
          let best = null;
          ex.sets.forEach((s) => {
            if (isSetPersonalRecord(ex.exerciseId, s, prior).isPR) {
              const val = calc1RM(s.weight, s.reps);
              if (!best || val > best.new1RM) best = { new1RM: val, weight: Number(s.weight) || 0, reps: Number(s.reps) || 0 };
            }
          });
          if (best) prsHit.push({ name: ex.name, ...best });
        });
        const nextState = {
          ...userData,
          activeWorkout: null,
          updatedAt: nowIso,
          workouts: editingHistoryId ? userData.workouts.map((w) => (w.id === editingHistoryId ? finalized : w)) : [finalized, ...userData.workouts],
        };
        setUserData(nextState);
        restEndTimeRef.current = null; chimeFiredRef.current = false; setRestRunning(false); setRestRemaining(restDuration);
        if (editingHistoryId) { setActiveTab('history'); pushToast('Workout updated in history!'); }
        else {
          if (prsHit.length > 0) pushToast(`[ NEW PR ] ${prsHit.map((p) => p.name).join(', ')}`, 'pr');
          setWorkoutSummary({ name: finalized.name, date: finalized.date, totalVolume: st.totalVolume, completedSets: st.completedSets, durationSeconds, prsHit });
        }
      };

      const buildRoutineExerciseEntry = (exMeta, setCount = 3) => {
        const lastSets = getLastLoggedSetsForExercise(exMeta.id, userData.workouts);
        const analytics = getExerciseAnalytics(exMeta.id, userData.workouts);
        const fallbackWeight = analytics.bestSet ? analytics.bestSet.weight : 0;
        const fallbackReps = analytics.bestSet ? analytics.bestSet.reps : 8;
        const count = Math.max(1, setCount);
        const sets = Array.from({ length: count }, (_, idx) => {
          const prev = lastSets[idx] || lastSets[lastSets.length - 1];
          return {
            id: `s-${uid()}`,
            weight: '',
            reps: '',
            ghostWeight: prev ? prev.weight : fallbackWeight,
            ghostReps: prev ? prev.reps : fallbackReps,
            completed: false,
          };
        });
        return { id: `we-${uid()}`, exerciseId: exMeta.id, name: exMeta.name, muscleGroup: exMeta.muscleGroup, sets };
      };

      const handleLaunchRoutine = (routine) => {
        const entries = routine.exercises.map((item) => {
          const meta = allExercises.find((e) => e.id === item.exerciseId);
          return meta ? buildRoutineExerciseEntry(meta, item.defaultSets) : null;
        }).filter(Boolean);
        setUserData((p) => ({ ...p, activeWorkout: { id: `w-${uid()}`, name: routine.name, date: todayISO(), notes: routine.notes || '', exercises: entries, startedAt: new Date().toISOString() } }));
        setActiveTab('workout');
        pushToast(`Launched "${routine.name}" with ghost targets`);
      };

      const handleSaveRoutine = (routine) => {
        setUserData((p) => {
          const existing = p.routines || [];
          const exists = existing.some((r) => r.id === routine.id);
          return { ...p, routines: exists ? existing.map((r) => (r.id === routine.id ? routine : r)) : [routine, ...existing], updatedAt: new Date().toISOString() };
        });
        pushToast(`Saved routine "${routine.name}"`);
      };

      const handleDeleteRoutine = (id) => {
        setUserData((p) => ({ ...p, routines: (p.routines || []).filter((r) => r.id !== id), updatedAt: new Date().toISOString() }));
        pushToast('Routine deleted');
      };

      const handleRestoreDefaultRoutines = () => {
        setUserData((p) => {
          const existing = p.routines || [];
          const missing = DEFAULT_ROUTINES.filter((def) => !existing.some((r) => r.id === def.id)).map((r) => ({ ...r, exercises: [...r.exercises] }));
          return { ...p, routines: [...missing, ...existing], updatedAt: new Date().toISOString() };
        });
        pushToast('Restored Push, Pull & Legs defaults');
      };

      const handleSaveWorkoutAsRoutine = (workout) => {
        if (!workout.exercises || workout.exercises.length === 0) {
          pushToast('Add at least one exercise before saving as a routine.', 'error');
          return;
        }
        handleSaveRoutine({
          id: `rtn-${uid()}`,
          name: workout.name || 'Saved Routine',
          splitTag: 'CUSTOM',
          notes: workout.notes || undefined,
          exercises: workout.exercises.map((ex) => ({ exerciseId: ex.exerciseId, defaultSets: Math.max(1, ex.sets.filter((s) => !s.isWarmup).length || 3) })),
          isBuiltIn: false,
          createdAt: new Date().toISOString(),
        });
      };

      const handleAddMeasurement = (entry, optionalWeight) => {
        setUserData((p) => {
          const restMeas = (p.measurements || []).filter((m) => m.date !== entry.date);
          let nextWeights = p.bodyWeights || [];
          if (optionalWeight && optionalWeight > 0) {
            nextWeights = [{ id: `bw-${uid()}`, date: entry.date, weight: optionalWeight, unit: p.unit, updatedAt: new Date().toISOString() }, ...nextWeights.filter((b) => b.date !== entry.date)];
          }
          return { ...p, measurements: [entry, ...restMeas], bodyWeights: nextWeights, updatedAt: new Date().toISOString() };
        });
        pushToast(`Saved measurements for ${formatShortDate(entry.date)}`);
      };

      const handleDeleteMeasurement = (id) => {
        setUserData((p) => ({ ...p, measurements: (p.measurements || []).filter((m) => m.id !== id), updatedAt: new Date().toISOString() }));
        pushToast('Measurement entry deleted');
      };

      const handleUpdateProfile = (patch) => {
        setUserData((p) => ({ ...p, profile: { ...(p.profile || { heightCm: null }), ...patch }, updatedAt: new Date().toISOString() }));
        if (patch.heightCm || patch.age !== undefined) pushToast('Athlete profile updated');
      };

      const handleChangeWarmupFocus = (focus) => {
        setUserData((p) => ({ ...p, warmupFocus: focus, updatedAt: new Date().toISOString() }));
      };

      const handleImportBackup = (incoming, mode) => {
        const nextState = mode === 'merge' ? mergeBackupData(userData, incoming) : normalizeUserData(incoming);
        setUserData(nextState);
        pushToast(mode === 'merge' ? `Merged backup (${nextState.workouts.length} total workouts)` : `Replaced local data with ${nextState.workouts.length} workouts`);
      };

      if (!currentUser) {
        return (
          <>
            <LandingView onAuthSuccess={handleAuthSuccess} onDemoLogin={handleDemoLogin} onGuestLogin={handleGuestLogin} />
            <ToastContainer toasts={toasts} onDismiss={(id) => setToasts((p) => p.filter((t) => t.id !== id))} />
          </>
        );
      }

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: Icons.LayoutDashboard },
        { id: 'workout', label: 'Workout', icon: Icons.Dumbbell, badge: userData.activeWorkout ? 'LIVE' : null },
        { id: 'library', label: 'Exercises', icon: Icons.BookOpen },
        { id: 'warmup', label: 'Warmup', icon: Icons.Flame },
        { id: 'routines', label: 'Routines', icon: Icons.Layers },
        { id: 'progress', label: 'Overload', icon: Icons.TrendingUp },
        { id: 'body', label: 'Bodyweight', icon: Icons.Scale },
        { id: 'measurements', label: 'Measurements', icon: Icons.Ruler },
        { id: 'history', label: 'History', icon: Icons.History },
        { id: 'coach', label: 'AI Coach', icon: Icons.MessageSquare },
      ];

      return (
        <div className="min-h-screen bg-[#050505] text-slate-100 flex flex-col">
          <header className="app-header z-40 h-14 sm:h-16 bg-[#09090b] border-b border-slate-800 gutter flex items-center justify-between gap-2">
            <div className="flex items-center gap-3 min-w-0">
              <button onClick={() => setActiveTab('dashboard')} className="flex items-center gap-2.5 text-left whitespace-nowrap shrink-0">
                <div className="w-8 h-8 bg-[#e11d48] flex items-center justify-center text-white shrink-0"><Icons.Dumbbell className="w-4 h-4 rotate-90" /></div>
                <span className="text-xl sm:text-2xl tracking-tight leading-none whitespace-nowrap uppercase font-extrabold" style={{ fontFamily: '"Barlow Condensed", sans-serif' }}><span className="text-white">IRON</span><span className="text-[#f43f5e]">PULSE</span></span>
              </button>
              <button onClick={() => setUserData((p) => ({ ...p, unit: p.unit === 'kg' ? 'lbs' : 'kg' }))} className="hidden sm:inline-flex items-center px-2.5 py-1 bg-slate-900 border border-slate-700 text-xs font-mono font-bold text-slate-300 hover:border-orange-500 whitespace-nowrap shrink-0">UNIT: <span className="text-orange-400 ml-1 uppercase">{userData.unit}</span></button>
            </div>
            <div className="flex items-center gap-2 sm:gap-3 shrink-0">
              <RestTimerWidget duration={restDuration} remaining={restRemaining} isRunning={restRunning} muted={Boolean(userData.restSettings?.muted)} onStart={handleStartRest} onPause={handlePauseRest} onReset={handleResetRest} onAdjustSeconds={handleAdjustRest} onSetDuration={(s) => { restEndTimeRef.current = null; chimeFiredRef.current = false; setUserData((p) => ({ ...p, restSettings: { ...p.restSettings, duration: s } })); setRestRemaining(s); setRestRunning(false); pushToast(`Rest timer set to ${s}s`); }} onToggleMute={() => setUserData((p) => ({ ...p, restSettings: { ...p.restSettings, muted: !p.restSettings?.muted } }))} />
              <div className="relative" ref={utilityMenuRef}>
                <button type="button" onClick={() => setUtilityMenuOpen((o) => !o)} className="px-2.5 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 hover:text-white text-xs flex items-center gap-1.5 min-h-[36px] whitespace-nowrap">
                  <Icons.Sliders className="w-3.5 h-3.5 text-orange-400" /><span className="hidden sm:inline">Tools</span>
                </button>
                {utilityMenuOpen && (
                  <div className="absolute right-0 mt-2 w-60 bg-slate-900 border border-slate-700 z-50 divide-y divide-slate-800">
                    <button type="button" onClick={() => { setUtilityMenuOpen(false); setOneRMModalExId(''); }} className="w-full text-left px-4 py-3 hover:bg-slate-800 flex items-center gap-2.5 text-xs text-white"><Icons.Calculator className="w-4 h-4 text-orange-400 shrink-0" /><div><div className="font-bold">1RM Calculator</div><div className="text-[11px] font-mono text-slate-400">Epley · Brzycki · 65–95%</div></div></button>
                    <button type="button" onClick={() => { setUtilityMenuOpen(false); setPlateModalState({}); }} className="w-full text-left px-4 py-3 hover:bg-slate-800 flex items-center gap-2.5 text-xs text-white"><Icons.Disc className="w-4 h-4 text-orange-400 shrink-0" /><div><div className="font-bold">Barbell & DB Plate Calc</div><div className="text-[11px] font-mono text-slate-400">Barbell · 1 DB · Pair DBs</div></div></button>
                    <button type="button" onClick={() => { setUtilityMenuOpen(false); setShowSettingsModal(true); }} className="w-full text-left px-4 py-3 hover:bg-slate-800 flex items-center gap-2.5 text-xs text-white"><Icons.Settings className="w-4 h-4 text-orange-400 shrink-0" /><div><div className="font-bold">Settings & JSON Backup</div><div className="text-[11px] font-mono text-slate-400">Export · Import · Preferences</div></div></button>
<button
                      type="button"
                      onClick={() => {
                        setUtilityMenuOpen(false);
                        setShowFeedbackModal(true);
                      }}
                      className="w-full text-left px-4 py-3 hover:bg-slate-800 flex items-center gap-2.5 text-xs text-white"
                    >
                      <Icons.MessageSquare className="w-4 h-4 text-orange-400 shrink-0" />
                      <div>
                        <div className="font-bold">Feedback &amp; Suggestions</div>
                        <div className="text-[11px] font-mono text-slate-400">
                          Bug Report · Feature Request
                        </div>
                      </div>
                    </button>
                    <button type="button" onClick={() => { setUtilityMenuOpen(false); handleSignOut(); }} className="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-[11px] font-mono text-slate-400 hover:text-orange-400 flex items-center gap-2"><Icons.LogOut className="w-3.5 h-3.5" /> Sign Out ({currentUser.name})</button>
                  </div>
                )}
              </div>
            </div>
          </header>

          <div className="flex-1 flex max-w-7xl w-full mx-auto">
            <aside className="hidden md:flex flex-col justify-between w-56 shrink-0 border-r border-slate-800 p-4">
              <nav className="space-y-1.5">
                {navItems.map((item) => (
                  <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center justify-between px-3.5 py-2.5 text-sm font-semibold whitespace-nowrap ${activeTab === item.id ? 'bg-orange-500 text-white font-bold' : 'text-slate-300 hover:bg-slate-900 hover:text-white'}`}>
                    <span className="flex items-center gap-2.5"><item.icon className="w-4 h-4" />{item.label}</span>
                    {item.badge && <span className={`px-1.5 py-0.5 font-mono text-[10px] font-extrabold ${activeTab === item.id ? 'bg-slate-950 text-white' : 'bg-orange-500/20 text-orange-400'}`}>{item.badge}</span>}
                  </button>
                ))}
              </nav>
              <div className="bg-slate-900 border border-slate-800 p-3.5 space-y-2.5">
                <div className="text-xs font-mono font-bold text-white truncate">{currentUser.name}</div>
                <div className="text-[11px] font-mono text-slate-400 truncate">{currentUser.email}</div>
                <button type="button" onClick={() => setShowSettingsModal(true)} className="w-full py-1.5 bg-slate-950 hover:bg-slate-800 border border-slate-700 text-[11px] font-mono text-slate-300 hover:text-white">Settings & Backup</button>
                <button type="button" onClick={handleSignOut} className="w-full py-1.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-[11px] font-mono text-slate-400 hover:text-orange-400 flex items-center justify-center gap-1.5"><Icons.LogOut className="w-3 h-3" /> Sign Out</button>
              </div>
            </aside>

            <main className="flex-1 min-w-0 py-4 sm:py-6 gutter pb-24 md:pb-8 overflow-x-hidden">
              {activeTab === 'dashboard' && (
                <DashboardView
                  user={currentUser}
                  userData={userData}
                  allExercises={allExercises}
                  onStartBlankWorkout={handleStartBlankWorkout}
                  onStartTemplateWorkout={handleStartTemplateWorkout}
                  onResumeWorkout={() => setActiveTab('workout')}
                  onNavigate={setActiveTab}
                  onOpenWorkoutHistory={(w) => { setSelectedHistoryWorkout(w); setActiveTab('history'); }}
                  onSelectExercise={setInspectExercise}
                />
              )}
              {activeTab === 'workout' && (
                <WorkoutView
                  workout={userData.activeWorkout}
                  pastWorkouts={userData.workouts}
                  allExercises={allExercises}
                  unit={userData.unit}
                  autoStartRest={Boolean(userData.restSettings?.autoStartOnSetComplete)}
                  restRunning={restRunning}
                  warmupFocus={userData.warmupFocus || 'general'}
                  onChangeWarmupFocus={handleChangeWarmupFocus}
                  onToggleAutoStartRest={() => setUserData((p) => ({ ...p, restSettings: { ...p.restSettings, autoStartOnSetComplete: !p.restSettings?.autoStartOnSetComplete } }))}
                  onUpdateWorkout={(w) => {
                    const stamped = { ...w, updatedAt: new Date().toISOString() };
                    setUserData((p) => ({ ...p, activeWorkout: stamped }));
                  }}
                  onFinishWorkout={handleFinishWorkout}
                  onDiscardWorkout={() => {
                    setUserData((p) => ({ ...p, activeWorkout: null }));
                    setActiveTab('dashboard'); pushToast('Workout discarded');
                  }}
                  onStartRestTimer={(label) => handleStartRest(restDuration, label)}
                  onStopRestTimer={handlePauseRest}
                  onSaveAsRoutine={handleSaveWorkoutAsRoutine}
                  onOpenExercisePicker={() => setShowExercisePicker(true)}
                  onInspectExercise={setInspectExercise}
                  onOpen1RMCalc={(exId) => setOneRMModalExId(exId || '')}
                  onOpenPlateCalc={(wt, mode) => setPlateModalState({ targetWeight: typeof wt === 'number' ? wt : undefined, mode })}
                  onNotify={pushToast}
                />
              )}
              {activeTab === 'library' && (
                <ExerciseLibraryView
                  allExercises={allExercises}
                  workouts={userData.workouts}
                  unit={userData.unit}
                  onSelectExercise={setInspectExercise}
                  onAddExerciseToWorkout={handleAddExerciseToWorkout}
                  onOpenCreateCustom={() => setCustomModalExercise(null)}
                  onOpenEditCustom={(ex) => setCustomModalExercise(ex)}
                />
              )}
              {activeTab === 'warmup' && (
                <WarmupView
                  warmupFocus={userData.warmupFocus || 'general'}
                  hasActiveWorkout={Boolean(userData.activeWorkout)}
                  onChangeFocus={handleChangeWarmupFocus}
                  onStartOrResumeWorkout={() => {
                    if (userData.activeWorkout) setActiveTab('workout');
                    else handleStartBlankWorkout();
                  }}
                />
              )}
              {activeTab === 'routines' && (
                <RoutinesView
                  routines={userData.routines || []}
                  workouts={userData.workouts}
                  allExercises={allExercises}
                  unit={userData.unit}
                  onLaunchRoutine={handleLaunchRoutine}
                  onSaveRoutine={handleSaveRoutine}
                  onDeleteRoutine={handleDeleteRoutine}
                  onRestoreDefaults={handleRestoreDefaultRoutines}
                  onSaveWorkoutAsRoutine={handleSaveWorkoutAsRoutine}
                />
              )}
              {activeTab === 'progress' && (
                <ProgressView allExercises={allExercises} workouts={userData.workouts} unit={userData.unit} onStartWorkout={handleStartBlankWorkout} />
              )}
              {activeTab === 'body' && (
                <BodyView
                  bodyWeights={userData.bodyWeights}
                  profile={userData.profile}
                  unit={userData.unit}
                  onAddWeight={(date, weight) => {
                    const exists = (userData.bodyWeights || []).some((e) => e.date === date);
                    const entry = { id: `bw-${uid()}`, date, weight, unit: userData.unit, updatedAt: new Date().toISOString() };
                    const next = { ...userData, bodyWeights: [entry, ...(userData.bodyWeights || []).filter((e) => e.date !== date)], updatedAt: new Date().toISOString() };
                    setUserData(next);
                    pushToast(exists ? `Updated weight for ${formatShortDate(date)}` : `Logged ${weight} ${userData.unit}`);
                  }}
                  onDeleteWeight={(id) => {
                    const next = { ...userData, bodyWeights: (userData.bodyWeights || []).filter((e) => e.id !== id), updatedAt: new Date().toISOString() };
                    setUserData(next);
                    pushToast('Weigh-in deleted');
                  }}
                  onSetHeight={(heightCm) => {
                    const next = { ...userData, profile: { ...(userData.profile || {}), heightCm }, updatedAt: new Date().toISOString() };
                    setUserData(next);
                    pushToast(`Height saved: ${heightCm} cm`);
                  }}
                  onUpdateProfile={handleUpdateProfile}
                  onNavigateMeasurements={() => setActiveTab('measurements')}
                />
              )}
              {activeTab === 'measurements' && (
                <MeasurementsView
                  measurements={userData.measurements || []}
                  bodyWeights={userData.bodyWeights}
                  profile={userData.profile}
                  weightUnit={userData.unit}
                  onAddMeasurement={handleAddMeasurement}
                  onDeleteMeasurement={handleDeleteMeasurement}
                  onUpdateProfile={handleUpdateProfile}
                />
              )}
              {activeTab === 'history' && (
                <HistoryView
                  workouts={userData.workouts}
                  unit={userData.unit}
                  selectedHistoryWorkout={selectedHistoryWorkout}
                  onSelectHistoryWorkout={setSelectedHistoryWorkout}
                  onEditWorkout={(w) => { setUserData((p) => ({ ...p, activeWorkout: { ...JSON.parse(JSON.stringify(w)), editingHistoryId: w.id } })); setActiveTab('workout'); }}
                  onDeleteWorkout={(id) => {
                    const next = { ...userData, workouts: userData.workouts.filter((w) => w.id !== id), updatedAt: new Date().toISOString() };
                    setUserData(next);
                    if (selectedHistoryWorkout?.id === id) setSelectedHistoryWorkout(null);
                    pushToast('Workout deleted from history');
                  }}
                  onSaveAsRoutine={handleSaveWorkoutAsRoutine}
                  onStartWorkout={handleStartBlankWorkout}
                />
              )}
              {activeTab === 'coach' && (
                <CoachView userData={userData} allExercises={allExercises} />
              )}
            </main>
          </div>

          <nav className="app-bottom-nav md:hidden fixed bottom-0 inset-x-0 z-40 bg-[#09090b] border-t border-slate-800 flex items-center justify-start overflow-x-auto gap-1 px-2 pt-1.5">
            {navItems.map((item) => {
              const active = activeTab === item.id;
              return (
                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`relative flex flex-col items-center gap-0.5 px-3 py-1.5 text-[10px] font-semibold min-h-[44px] shrink-0 justify-center whitespace-nowrap ${active ? 'text-orange-400' : 'text-slate-400'}`}>
                  <item.icon className="w-5 h-5" />
                  <span>{item.label}</span>
                  {item.badge && <span className="absolute top-1 right-1.5 w-1.5 h-1.5 bg-orange-500" />}
                </button>
              );
            })}
          </nav>

          <ExerciseDetailModal exercise={inspectExercise} allExercises={allExercises} workouts={userData.workouts} unit={userData.unit} onClose={() => setInspectExercise(null)} onAddToWorkout={handleAddExerciseToWorkout} onSelectExercise={setInspectExercise} onEditCustom={(ex) => setCustomModalExercise(ex)} onDeleteCustom={handleDeleteCustomExercise} />
          {customModalExercise !== undefined && <CustomExerciseModal initialExercise={customModalExercise} onClose={() => setCustomModalExercise(undefined)} onSave={handleSaveCustomExercise} />}
          {showExercisePicker && <ExercisePickerModal exercises={allExercises} onSelect={handleAddExerciseToWorkout} onClose={() => setShowExercisePicker(false)} onCreateCustom={() => setCustomModalExercise(null)} />}
          <WorkoutSummaryModal summary={workoutSummary} unit={userData.unit} onClose={() => { setWorkoutSummary(null); setActiveTab('dashboard'); }} onViewHistory={() => { setWorkoutSummary(null); setActiveTab('history'); }} />
          {oneRMModalExId !== null && <OneRMCalculatorModal exercises={allExercises} workouts={userData.workouts} unit={userData.unit} initialExerciseId={oneRMModalExId || undefined} onClose={() => setOneRMModalExId(null)} onOpenPlateCalc={(wt, mode) => { setOneRMModalExId(null); setPlateModalState({ targetWeight: wt, mode }); }} />}
          {plateModalState !== null && <PlateCalculatorModal unit={userData.unit} initialTargetWeight={plateModalState.targetWeight} initialMode={plateModalState.mode} onClose={() => setPlateModalState(null)} />}
{showFeedbackModal && (
            <FeedbackModal
              currentUser={currentUser}
              onClose={() => setShowFeedbackModal(false)}
              onNotify={pushToast}
            />
          )}
{showFeedbackModal && (
  <FeedbackModal onClose={() => setShowFeedbackModal(false)} />
)}
          {showSettingsModal && <SettingsModal currentUser={currentUser} userData={userData} onClose={() => setShowSettingsModal(false)} onToggleUnit={(u) => setUserData((p) => ({ ...p, unit: u, updatedAt: new Date().toISOString() }))} onUpdateRestSettings={(patch) => setUserData((p) => ({ ...p, restSettings: { ...p.restSettings, ...patch } }))} onImportBackup={handleImportBackup} onSignOut={handleSignOut} onNotify={pushToast} />}
          <ToastContainer toasts={toasts} onDismiss={(id) => setToasts((p) => p.filter((t) => t.id !== id))} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
<script>
  window.si = window.si || function () { 
    (window.siq = window.siq || []).push(arguments); 
  };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
  <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registered successfully!', reg))
            .catch((err) => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
</body>
</html>
